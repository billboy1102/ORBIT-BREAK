<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050711">
<title>ORBIT BREAK</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050711;opacity:0;pointer-events:none;transition:opacity .12s ease}
#gameFrame.ready{opacity:1;pointer-events:auto}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a9faff;font:900 12px system-ui;letter-spacing:2px;background:#050711}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">SYNCING BEAT...</div>
<iframe id="gameFrame" title="ORBIT BREAK"></iframe>
<script>
(() => {
'use strict';
const frame=document.getElementById('gameFrame');
const boot=document.getElementById('boot');
let patched=false;

const addon=String.raw`
/* ORBIT BREAK RHYTHM ADDON */
const RHYTHM_BPM=124,RHYTHM_BEAT=60/RHYTHM_BPM;
let rhythmGain=null,rhythmSfx=null,rhythmNoise=null,rhythmTimer=null,rhythmStarted=false,rhythmPhase=0,rhythmNextBeat=0,rhythmBeatIndex=0,rhythmSegmentStart=0;
let rhythmBeatDot=null,rhythmBeatBar=null;

function rhythmInit(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(!rhythmGain){
      const master=audioCtx.createGain();master.gain.value=.74;
      const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.22;
      master.connect(comp);comp.connect(audioCtx.destination);
      rhythmGain=audioCtx.createGain();rhythmGain.gain.value=.0001;rhythmGain.connect(master);
      rhythmSfx=audioCtx.createGain();rhythmSfx.gain.value=.9;rhythmSfx.connect(master);
      rhythmNoise=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*.25),audioCtx.sampleRate);
      const d=rhythmNoise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    return true;
  }catch(e){return false}
}
function rhythmTone(freq,dur,vol,type){
  if(!rhythmInit())return;
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*1.28),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(rhythmSfx);o.start(t);o.stop(t+dur+.02);
}
function rhythmNote(freq,time,dur,vol,type){
  const o=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  o.type=type||'sawtooth';o.frequency.setValueAtTime(freq,time);f.type='lowpass';f.frequency.setValueAtTime(1250,time);f.Q.value=2.2;
  g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+.012);g.gain.exponentialRampToValueAtTime(.0001,time+dur);
  o.connect(f);f.connect(g);g.connect(rhythmGain);o.start(time);o.stop(time+dur+.03);
}
function rhythmKick(time){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(145,time);o.frequency.exponentialRampToValueAtTime(42,time+.13);g.gain.setValueAtTime(.18,time);g.gain.exponentialRampToValueAtTime(.0001,time+.16);o.connect(g);g.connect(rhythmGain);o.start(time);o.stop(time+.18);
}
function rhythmNoiseHit(time,vol,high,dur){
  const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=rhythmNoise;f.type='highpass';f.frequency.value=high;g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.0001,time+dur);src.connect(f);f.connect(g);g.connect(rhythmGain);src.start(time);src.stop(time+dur+.02);
}
function rhythmBeat(i,time){
  rhythmKick(time);
  if(i%4===1||i%4===3){rhythmNoiseHit(time,.064,1700,.12);rhythmNote(180,time,.09,.018,'triangle')}
  rhythmNoiseHit(time,.017,7200,.028);rhythmNoiseHit(time+RHYTHM_BEAT*.5,.011,8200,.022);
  const bass=[55,55,65.41,49][i%4];rhythmNote(bass,time,RHYTHM_BEAT*.72,.038,'sawtooth');
  const arp=[220,329.63,440,261.63,220,392,523.25,329.63][i%8];rhythmNote(arp,time+.02,RHYTHM_BEAT*.3,.014,'square');
  if(i%16===0)rhythmNote(110,time,RHYTHM_BEAT*3.6,.022,'triangle');
}
function rhythmSchedule(){
  if(!rhythmStarted||!audioCtx)return;
  while(rhythmNextBeat<audioCtx.currentTime+.18){rhythmBeat(rhythmBeatIndex,rhythmNextBeat);rhythmBeatIndex++;rhythmNextBeat+=RHYTHM_BEAT}
}
function rhythmStart(){
  if(!rhythmInit())return;
  if(rhythmTimer)clearInterval(rhythmTimer);
  const t=audioCtx.currentTime+.08;rhythmStarted=true;rhythmPhase=t;rhythmNextBeat=t;rhythmBeatIndex=0;
  rhythmGain.gain.cancelScheduledValues(audioCtx.currentTime);rhythmGain.gain.setValueAtTime(Math.max(.0001,rhythmGain.gain.value),audioCtx.currentTime);rhythmGain.gain.exponentialRampToValueAtTime(.62,audioCtx.currentTime+.18);
  rhythmSchedule();rhythmTimer=setInterval(rhythmSchedule,30);
}
function rhythmStop(){
  if(rhythmTimer){clearInterval(rhythmTimer);rhythmTimer=null}rhythmStarted=false;
  if(audioCtx&&rhythmGain){rhythmGain.gain.cancelScheduledValues(audioCtx.currentTime);rhythmGain.gain.setValueAtTime(Math.max(.0001,rhythmGain.gain.value),audioCtx.currentTime);rhythmGain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22)}
}
function rhythmHit(perfect){
  rhythmTone(perfect?760:560,.055,perfect?.075:.052,'sine');
  setTimeout(function(){rhythmTone(perfect?1140:820,.045,perfect?.045:.028,'triangle')},28);
}
function rhythmFail(){rhythmTone(170,.18,.09,'sawtooth');setTimeout(function(){rhythmTone(85,.22,.06,'sine')},45)}
function rhythmPulse(){
  if(!audioCtx||!rhythmStarted)return 0;
  let p=(audioCtx.currentTime-rhythmPhase)%RHYTHM_BEAT;if(p<0)p+=RHYTHM_BEAT;return Math.exp(-(p/RHYTHM_BEAT)*8);
}

/* CLEAN GAMEPLAY UI + REDESIGNED START MENU */
function rhythmUi(){
  const themeBadge=document.getElementById('themeBadge');if(themeBadge)themeBadge.remove();
  const bottom=document.querySelector('.bottom');if(bottom)bottom.remove();
  const style=document.createElement('style');
  style.textContent='body.menu-start .top{opacity:0;transform:translateY(-18px)}.top{transition:opacity .3s ease,transform .3s ease}#start{width:min(88vw,410px);padding:30px 20px 34px;border-radius:34px;background:linear-gradient(180deg,rgba(5,11,26,.10),rgba(5,11,26,.52));border:1px solid rgba(125,240,255,.08);box-shadow:0 34px 90px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(3px)}#start .logo{margin-top:18px;font-size:clamp(58px,16vw,88px);line-height:.82;letter-spacing:-5px;background:linear-gradient(180deg,#ffffff 0%,#d7fbff 48%,#ff9de7 118%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 20px rgba(89,234,255,.22)) drop-shadow(0 0 34px rgba(255,69,207,.12))}#start .cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:220px;height:58px;margin:34px auto 0;padding:0;border-radius:999px;background:linear-gradient(90deg,#42e9ff 0%,#6d8cff 48%,#ff4ccf 100%);color:#fff;font-size:17px;font-weight:1000;letter-spacing:.8px;border:1px solid rgba(255,255,255,.42);box-shadow:0 0 0 1px rgba(70,235,255,.08),0 12px 36px rgba(68,114,255,.32),0 0 30px rgba(255,72,205,.20);overflow:hidden}#start .cta:after{content:"";position:absolute;inset:1px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}#start .playtri{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #fff;filter:drop-shadow(0 0 7px #fff)}#start .menu-emblem{position:relative;width:92px;height:92px;margin:0 auto 4px;filter:drop-shadow(0 0 18px rgba(74,235,255,.22))}.menu-ring-a,.menu-ring-b{position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(76,235,255,.9)}.menu-ring-b{inset:20px;border-color:rgba(255,74,204,.82);animation:menuPulse 1.8s ease-in-out infinite}.menu-axis{position:absolute;left:45px;top:7px;width:2px;height:78px;background:linear-gradient(#58f4ff,#ffffff,#ff57ce);transform:rotate(38deg);transform-origin:center;box-shadow:0 0 12px rgba(100,240,255,.8)}.menu-core{position:absolute;left:37px;top:37px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 28px rgba(74,235,255,.9)}.menu-dot{position:absolute;left:40px;top:2px;width:12px;height:12px;border-radius:50%;background:#59efff;box-shadow:0 0 12px #59efff,0 0 26px rgba(89,239,255,.8);transform-origin:6px 44px;animation:menuSpin 2.6s linear infinite}@keyframes menuSpin{to{transform:rotate(360deg)}}@keyframes menuPulse{0%,100%{transform:scale(.94);opacity:.62}50%{transform:scale(1.08);opacity:1}}@media(max-height:650px){#start{padding:20px 16px 24px}#start .menu-emblem{width:72px;height:72px}#start .logo{font-size:50px}#start .cta{margin-top:24px;height:52px}}';
  document.head.appendChild(style);
  const start=document.getElementById('start');
  if(start)start.innerHTML='<div class="menu-emblem"><span class="menu-ring-a"></span><span class="menu-ring-b"></span><span class="menu-axis"></span><span class="menu-core"></span><span class="menu-dot"></span></div><div class="logo">ORBIT<br>BREAK</div><div class="cta"><span class="playtri"></span>BẮT ĐẦU</div>';
  document.body.classList.add('menu-start');
}
rhythmUi();
/* Disable all moving neon text-box billboards while keeping the cyberpunk background itself. */
if(typeof billboards==='function')billboards=function(){};

chooseGoal=function(){
  const min=hits<4?2.0:(hits<12?1.35:.95),max=hits<4?3.8:(hits<12?4.45:5.15);
  if(hits>7&&Math.random()<Math.min(.12+(hits-7)*.008,.28))dir*=-1;
  if(audioCtx&&rhythmStarted){
    const t=audioCtx.currentTime;rhythmSegmentStart=t;
    const first=rhythmPhase+Math.ceil(Math.max(0,(t-rhythmPhase)/RHYTHM_BEAT))*RHYTHM_BEAT,c=[];
    for(let n=1;n<=7;n++){const ht=first+n*RHYTHM_BEAT,g=speed*(ht-t);if(g>=min&&g<=max)c.push({g:g,t:ht})}
    let pick=c.length?c[Math.floor(Math.random()*c.length)]:null;
    if(!pick){const wanted=(min+max)*.5;let err=1e9;for(let n=1;n<=7;n++){const ht=first+n*RHYTHM_BEAT,g=speed*(ht-t),e=Math.abs(g-wanted);if(e<err){err=e;pick={g:g,t:ht}}}}
    goal=pick.g;
  }else goal=rand(min,max);
};
reset=function(){
  score=0;combo=1;bestCombo=1;hits=0;speed=1.72;dir=1;progress=0;goal=2.65;anchor={x:0,y:0};startAngle=-Math.PI/2;camera={x:0,y:0};trail=[];sparks=[];history=[];shake=0;flash=0;message='';
  rhythmStart();chooseGoal();buildTarget();state='play';document.body.classList.remove('menu-start');el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();rhythmTone(330,.06,.045,'triangle');
};
success=function(delta){
  const old={...anchor};history.push({x1:old.x,y1:old.y,x2:target.x,y2:target.y,life:1});if(history.length>90)history.shift();anchor={x:target.x,y:target.y};startAngle=Math.atan2(old.y-anchor.y,old.x-anchor.x);progress=0;hits++;
  const error=delta/Math.max(.01,speed),perfect=error<=.055;if(perfect){combo++;score+=20*combo;toast('BEAT PERFECT','#8bffd5')}else{score+=10*combo;toast('ON BEAT','#ffe47a')}rhythmHit(perfect);
  bestCombo=Math.max(bestCombo,combo);speed=Math.min(4.15,1.72+hits*.055);flash=perfect?.52:.32;burst(anchor.x,anchor.y,perfect?28:16);if(navigator.vibrate)navigator.vibrate(perfect?16:8);chooseGoal();buildTarget();updateHUD();
};
die=function(label){
  if(state!=='play')return;state='dying';message=label;shake=13;flash=1;rhythmFail();rhythmStop();if(navigator.vibrate)navigator.vibrate([25,35,55]);
  setTimeout(function(){state='over';high=Math.max(high,score);localStorage.setItem('orbitBreakHigh',String(high));el.final.textContent=score;el.high.textContent=high;el.finalCombo.textContent='x'+bestCombo;el.over.classList.remove('hidden')},430);
};
update=function(dt){
  if(state==='play'){
    if(audioCtx&&rhythmStarted)progress=speed*Math.max(0,audioCtx.currentTime-rhythmSegmentStart);else progress+=speed*dt;
    const tol=clamp(.30-hits*.004,.18,.30);if(progress>goal+tol)die('MISS BEAT');
    const b=ballPos();trail.push({x:b.x,y:b.y,life:1});if(trail.length>34)trail.shift();const look=.30,desiredX=anchor.x+(target.x-anchor.x)*look,desiredY=anchor.y+(target.y-anchor.y)*look,follow=1-Math.exp(-dt*10);camera.x+=(desiredX-camera.x)*follow;camera.y+=(desiredY-camera.y)*follow;
  }
  for(const p of trail)p.life-=dt*2.15;trail=trail.filter(p=>p.life>0);for(const h of history)h.life=Math.max(.16,h.life-dt*.05);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.955,dt*60);p.vy*=Math.pow(.955,dt*60);p.life-=dt}sparks=sparks.filter(p=>p.life>0);shake=Math.max(0,shake-dt*36);flash=Math.max(0,flash-dt*2.8);
};
const rhythmBaseDraw=draw;
draw=function(){rhythmBaseDraw();const bp=rhythmPulse();if(bp>.03){const g=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.25,W*.5,H*.5,Math.max(W,H)*.72);g.addColorStop(0,'rgba(70,255,235,0)');g.addColorStop(1,'rgba(70,235,255,'+(bp*.045)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}};
document.addEventListener('visibilitychange',function(){if(document.hidden){if(state==='play')rhythmStop()}else if(state==='play'){rhythmStart();chooseGoal();buildTarget();progress=0}});
`;

function patchGame(){
  const doc=frame.contentDocument;
  if(!doc)throw new Error('Không đọc được game-base.html');
  let html='<!doctype html>\n'+doc.documentElement.outerHTML;
  const marker='resize();\nrequestAnimationFrame(loop);';
  if(!html.includes(marker))throw new Error('Không tìm thấy điểm chèn rhythm module');
  html=html.replace(marker,addon+'\n'+marker);
  patched=true;
  frame.srcdoc=html;
}

frame.addEventListener('load',()=>{
  if(patched){boot.classList.add('hide');frame.classList.add('ready');return}
  try{patchGame()}catch(err){console.error(err);boot.textContent='RHYTHM LOAD FAILED';frame.classList.add('ready')}
});
frame.src='game-base.html';
})();
</script>
</body>
</html>
