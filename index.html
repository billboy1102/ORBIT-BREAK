function rhythmInit(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    if(!rhythmGain){
      const master=audioCtx.createGain();master.gain.value=.74;
      const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.22;
      master.connect(comp);comp.connect(audioCtx.destination);

      rhythmSfx=audioCtx.createGain();rhythmSfx.gain.value=.9;rhythmSfx.connect(master);
      rhythmNoise=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*.25),audioCtx.sampleRate);

    }
    return true;
  }catch(e){return false}
}
function rhythmTone(freq,dur,vol,type){
  if(!rhythmInit())return;
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();

}
function rhythmNote(freq,time,dur,vol,type){
  const o=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();

  o.connect(f);f.connect(g);g.connect(rhythmGain);o.start(time);o.stop(time+dur+.03);
}
function rhythmKick(time){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(145,time);o.frequency.exponentialRampToValueAtTime(42,time+.13);g.gain.setValueAtTime(.18,time);g.gain.exponentialRampToValueAtTime(.0001,time+.16);o.connect(g);g.connect(rhythmGain);o.start(time);o.stop(time+.18);
}
function rhythmNoiseHit(time,vol,high,dur){

}
function rhythmBeat(i,time){
  rhythmKick(time);
  if(i%4===1||i%4===3){rhythmNoiseHit(time,.064,1700,.12);rhythmNote(180,time,.09,.018,'triangle')}

function rhythmSchedule(){
  if(!rhythmStarted||!audioCtx)return;
  while(rhythmNextBeat<audioCtx.currentTime+.18){rhythmBeat(rhythmBeatIndex,rhythmNextBeat);rhythmBeatIndex++;rhythmNextBeat+=RHYTHM_BEAT}

function rhythmStart(){
  if(!rhythmInit())return;
  if(rhythmTimer)clearInterval(rhythmTimer);
  const t=audioCtx.currentTime+.08;rhythmStarted=true;rhythmPhase=t;rhythmNextBeat=t;rhythmBeatIndex=0;

}
function rhythmStop(){

}

function laserVault(t){sky(t);let vx=W*.5-camera.x*.04,vy=H*.39-camera.y*.03;ctx.save();ctx.globalCompositeOperation='screen';for(let i=-9;i<=9;i++){ctx.strokeStyle=rgba(i%2?t.a:t.b,.10);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(vx+i*7,vy);ctx.lineTo(W*.5+i*W*.13,H+35);ctx.stroke()}for(let j=0;j<18;j++){let d=((j+now*.0036)%18)/18,y=vy+d*d*(H-vy+40);ctx.strokeStyle=rgba(j%2?t.c:t.a,.04+(1-d)*.11);ctx.lineWidth=1+d*2;ctx.beginPath();ctx.moveTo(W*(.08*d),y);ctx.lineTo(W-W*(.08*d),y);ctx.stroke()}for(let i=0;i<10;i++){let x=((i*101-camera.x*.18)%(W+100)+(W+100))%(W+100)-50,h=H*(.18+(i%4)*.05),y=H-h;ctx.fillStyle=rgba(i%2?t.a:t.b,.035);ctx.fillRect(x,y,10+i%3*5,h);ctx.strokeStyle=rgba(i%2?t.a:t.b,.14);ctx.strokeRect(x,y,10+i%3*5,h)}ctx.restore()}
function crystalVoid(t){sky(t);ctx.save();ctx.globalCompositeOperation='screen';let cx=W*.5-camera.x*.035,cy=H*.48-camera.y*.035;for(let i=0;i<18;i++){let a=now*.00022*(i%2?1:-1)+i*TAU/18,r=55+(i%6)*42,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.75,z=10+(i%5)*4;ctx.beginPath();ctx.moveTo(x,y-z*1.8);ctx.lineTo(x+z,y);ctx.lineTo(x,y+z*1.8);ctx.lineTo(x-z,y);ctx.closePath();ctx.fillStyle=rgba(i%3===0?t.a:i%3===1?t.b:t.c,.035+(i%4)*.012);ctx.strokeStyle=rgba(i%2?t.a:t.b,.16);ctx.lineWidth=1.2;ctx.fill();ctx.stroke()}for(let r=80;r<Math.max(W,H);r+=70){ctx.strokeStyle=rgba(t.c,.035);ctx.beginPath();ctx.arc(cx,cy,r,now*.0002,-now*.0002+Math.PI*1.4);ctx.stroke()}ctx.restore()}
function solarDrive(t){sky(t);let cx=W*.5-camera.x*.03,cy=H*.37-camera.y*.025,beat=typeof rhythmPulse==='function'?rhythmPulse():0;ctx.save();ctx.globalCompositeOperation='screen';let g=ctx.createRadialGradient(cx,cy,0,cx,cy,120+beat*18);g.addColorStop(0,rgba('#ffffff',.24));g.addColorStop(.18,rgba(t.a,.26));g.addColorStop(.55,rgba(t.b,.10));g.addColorStop(1,rgba(t.b,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<28;i++){let a=now*.00018+i*TAU/28,r0=42,r1=110+(i%5)*24+beat*12;ctx.strokeStyle=rgba(i%2?t.a:t.b,.045+(i%4)*.012);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke()}for(let i=0;i<10;i++){let r=50+i*28;ctx.strokeStyle=rgba(i%2?t.c:t.a,.05);ctx.beginPath();ctx.ellipse(cx,cy,r,r*.42,now*.00015,0,TAU);ctx.stroke()}ctx.restore()}
const originalThemeDraw=themeDraw;
themeDraw=function(i,t){if(i<4)return originalThemeDraw(i,t);if(i===4)return plasmaRift(t);if(i===5)return laserVault(t);if(i===6)return crystalVoid(t);return solarDrive(t)};
/* Keep boss energy FX but remove all boss text. */
bossFx=function(t){let b=clamp((combo-5)/9,0,1);if(!b)return;let beat=typeof rhythmPulse==='function'?rhythmPulse():0,cx=W*.5-camera.x*.02,cy=H*.42-camera.y*.02,q=b*(.75+.25*Math.sin(now*.008)+beat*.35);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<7;i++){let r=42+i*30+q*18;ctx.strokeStyle=rgba(i%2?t.b:t.a,.07+q*.13);ctx.lineWidth=1.2+i*.3;ctx.beginPath();ctx.arc(cx,cy,r,now*.0006*(i%2?1:-1),now*.0006*(i%2?1:-1)+Math.PI*1.45);ctx.stroke()}for(let i=0;i<12;i++){let a=now*.0009+i*TAU/12,r=50+q*24;ctx.strokeStyle=rgba(i%2?t.a:t.b,.05+q*.1);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.55);ctx.lineTo(cx+Math.cos(a)*(r+70),cy+Math.sin(a)*(r+70)*.55);ctx.stroke()}let g=ctx.createRadialGradient(cx,cy,0,cx,cy,92);g.addColorStop(0,rgba('#ffffff',.14*q));g.addColorStop(.2,rgba(t.b,.2*q));g.addColorStop(1,rgba(t.a,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,94,0,TAU);ctx.fill();ctx.restore()};
/* Change theme every 3 hits instead of every 5. */
drawBackground=function(){let n=Math.floor(hits/3)%THEMES.length;if(n!==themeNow){themePrev=themeNow;themeNow=n;themeAt=now;updateHUD()}let m=clamp((now-themeAt)/850,0,1),e=m*m*(3-2*m);ctx.fillStyle='#010308';ctx.fillRect(0,0,W,H);ctx.save();themeDraw(themePrev,THEMES[themePrev]);ctx.restore();if(themeNow!==themePrev){ctx.save();ctx.globalAlpha=e;themeDraw(themeNow,THEMES[themeNow]);ctx.restore()}deepTunnel(THEMES[themeNow]);bossFx(THEMES[themeNow]);let flow=clamp((speed-1.8)/3.7,0,1);for(let d of dust){let sh=now*.022*d.s*(.75+flow*1.25),x=((d.x-camera.x*.44-sh*Math.cos(d.a))%(W+180)+(W+180))%(W+180)-90,y=((d.y-camera.y*.44-sh*Math.sin(d.a))%(H+180)+(H+180))%(H+180)-90;ctx.strokeStyle=rgba(THEMES[themeNow].a,.05+flow*.17);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d.l*(1+flow*.45)*Math.cos(d.a),y+d.l*(1+flow*.45)*Math.sin(d.a));ctx.stroke()}};
const fastBaseTap=tap;removeEventListener('pointerdown',fastBaseTap);
tap=function(e){if(e)e.preventDefault();if(state==='menu'||state==='over'){reset();return}if(state!=='play')return;let tol=clamp(speed*.075,.26,.42),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'MISS BEAT')};
addEventListener('pointerdown',tap,{passive:false});


chooseGoal=function(){
  const min=hits<4?2.0:(hits<12?1.35:.95),max=hits<4?3.8:(hits<12?4.45:5.15);
  if(hits>7&&Math.random()<Math.min(.12+(hits-7)*.008,.28))dir*=-1;
  if(audioCtx&&rhythmStarted){
    const t=audioCtx.currentTime;rhythmSegmentStart=t;
    const first=rhythmPhase+Math.ceil(Math.max(0,(t-rhythmPhase)/RHYTHM_BEAT))*RHYTHM_BEAT,c=[];
    for(let n=1;n<=7;n++){const ht=first+n*RHYTHM_BEAT,g=speed*(ht-t);if(g>=min&&g<=max)c.push({g:g,t:ht})}
    let pick=c.length?c[Math.floor(Math.random()*c.length)]:null;
    if(!pick){const wanted=(min+max)*.5;let err=1e9;for(let n=1;n<=7;n++){const ht=first+n*RHYTHM_BEAT,g=speed*(ht-t),e=Math.abs(g-wanted);if(e<err){err=e;pick={g:g,t:ht}}}}
    goal=pick.g;
  }else goal=rand(min,max);
};
reset=function(){
  score=0;combo=1;bestCombo=1;hits=0;speed=2.15;dir=1;progress=0;goal=2.65;anchor={x:0,y:0};startAngle=-Math.PI/2;camera={x:0,y:0};trail=[];sparks=[];history=[];shake=0;flash=0;message='';
  rhythmStart();chooseGoal();buildTarget();state='play';document.body.classList.remove('menu-start','menu-over');el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();rhythmTone(330,.06,.045,'triangle');
};
success=function(delta){
  const old={...anchor};history.push({x1:old.x,y1:old.y,x2:target.x,y2:target.y,life:1});if(history.length>90)history.shift();anchor={x:target.x,y:target.y};startAngle=Math.atan2(old.y-anchor.y,old.x-anchor.x);progress=0;hits++;
  const error=delta/Math.max(.01,speed),perfect=error<=.055;if(perfect){combo++;score+=20*combo;toast('BEAT PERFECT','#8bffd5')}else{score+=10*combo;toast('ON BEAT','#ffe47a')}rhythmHit(perfect);
  bestCombo=Math.max(bestCombo,combo);speed=Math.min(5.35,2.15+hits*.09);flash=perfect?.52:.32;burst(anchor.x,anchor.y,perfect?28:16);if(navigator.vibrate)navigator.vibrate(perfect?16:8);chooseGoal();buildTarget();updateHUD();
};
die=function(label){
  if(state!=='play')return;state='dying';message=label;shake=13;flash=1;rhythmFail();rhythmStop();if(navigator.vibrate)navigator.vibrate([25,35,55]);
  setTimeout(function(){state='over';high=Math.max(high,score);localStorage.setItem('orbitBreakHigh',String(high));el.final.textContent=score;el.high.textContent=high;el.finalCombo.textContent='x'+bestCombo;document.body.classList.add('menu-over');el.over.classList.remove('hidden')},430);
};
update=function(dt){
  if(state==='play'){
    if(audioCtx&&rhythmStarted)progress=speed*Math.max(0,audioCtx.currentTime-rhythmSegmentStart);else progress+=speed*dt;
    const tol=clamp(speed*.075,.26,.42);if(progress>goal+tol)die('MISS BEAT');
    const b=ballPos();trail.push({x:b.x,y:b.y,life:1});if(trail.length>34)trail.shift();const look=.30,desiredX=anchor.x+(target.x-anchor.x)*look,desiredY=anchor.y+(target.y-anchor.y)*look,follow=1-Math.exp(-dt*10);camera.x+=(desiredX-camera.x)*follow;camera.y+=(desiredY-camera.y)*follow;
  }
  for(const p of trail)p.life-=dt*2.15;trail=trail.filter(p=>p.life>0);for(const h of history)h.life=Math.max(.16,h.life-dt*.05);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.955,dt*60);p.vy*=Math.pow(.955,dt*60);p.life-=dt}sparks=sparks.filter(p=>p.life>0);shake=Math.max(0,shake-dt*36);flash=Math.max(0,flash-dt*2.8);
};
const rhythmBaseDraw=draw;
draw=function(){rhythmBaseDraw();const bp=rhythmPulse();if(bp>.03){const g=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.25,W*.5,H*.5,Math.max(W,H)*.72);g.addColorStop(0,'rgba(70,255,235,0)');g.addColorStop(1,'rgba(70,235,255,'+(bp*.045)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}};
document.addEventListener('visibilitychange',function(){if(document.hidden){if(state==='play')rhythmStop()}else if(state==='play'){rhythmStart();chooseGoal();buildTarget();progress=0}});
`;

function patchGame(){
  const doc=frame.contentDocument;
  if(!doc)throw new Error('Không đọc được game-base.html');
  let html='<!doctype html>\n'+doc.documentElement.outerHTML;
  const marker='resize();\nrequestAnimationFrame(loop);';
  if(!html.includes(marker))throw new Error('Không tìm thấy điểm chèn rhythm module');
  html=html.replace(marker,addon+'\n'+marker);
  patched=true;
  frame.srcdoc=html;
}

frame.addEventListener('load',()=>{
  if(patched){boot.classList.add('hide');frame.classList.add('ready');return}
  try{patchGame()}catch(err){console.error(err);boot.textContent='RHYTHM LOAD FAILED';frame.classList.add('ready')}
});
frame.src='game-base.html';
})();
</script>
