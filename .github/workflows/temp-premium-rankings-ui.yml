name: Temporary premium rankings UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-premium-rankings-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upgrade rankings visual design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/fix_simple_ui.py')
          s = p.read_text(encoding='utf-8')

          marker = '@keyframes simpleTapPulse'
          premium = r'''/* PREMIUM RANKINGS UI */#orbitRankingsModal{top:0!important;left:0!important;right:0!important;bottom:calc(84px + env(safe-area-inset-bottom))!important;inset:auto!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;padding:max(18px,env(safe-area-inset-top)) 12px 18px!important;overflow:auto!important;background:radial-gradient(circle at 50% 2%,rgba(40,224,255,.16),transparent 35%),linear-gradient(180deg,rgba(2,7,18,.94),rgba(2,5,12,.80))!important;backdrop-filter:blur(9px)!important;-webkit-backdrop-filter:blur(9px)!important}#orbitRankingsModal.hidden{display:none!important}#orbitRankingsModal:before{content:"";position:fixed;left:8%;right:8%;top:84px;height:1px;background:linear-gradient(90deg,transparent,rgba(104,240,255,.7),transparent);box-shadow:0 0 18px rgba(81,232,255,.45);pointer-events:none}.orbit-rank-panel{position:relative!important;width:min(94vw,520px)!important;max-height:none!important;margin:max(60px,7vh) auto 18px!important;padding:20px 14px 16px!important;border:1px solid rgba(112,235,255,.34)!important;border-radius:24px!important;background:linear-gradient(180deg,rgba(10,22,37,.97),rgba(5,12,24,.96))!important;box-shadow:0 28px 90px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.03) inset,0 0 42px rgba(49,220,255,.10)!important;overflow:hidden!important}.orbit-rank-panel:before{content:"";position:absolute;left:-15%;right:-15%;top:-110px;height:180px;background:radial-gradient(ellipse at center,rgba(73,238,255,.20),transparent 66%);pointer-events:none}.orbit-rank-panel:after{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 25%,transparent 75%,rgba(48,224,255,.035))}.orbit-rank-panel h2{position:relative;margin:4px 44px 5px!important;font-size:clamp(34px,9vw,50px)!important;font-weight:250!important;letter-spacing:.12em!important;text-shadow:0 0 18px rgba(169,248,255,.38),0 0 42px rgba(46,221,255,.14)!important}.orbit-rank-sub{position:relative;margin:0 0 17px!important;font-size:10px!important;font-weight:600!important;letter-spacing:.24em!important;color:rgba(126,236,255,.70)!important}.orbit-rank-sub:before,.orbit-rank-sub:after{content:"◆";font-size:7px;margin:0 10px;color:rgba(92,234,255,.82)}.orbit-rank-panel .orbit-close{right:9px!important;top:9px!important;width:38px!important;height:38px!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:50%!important;background:rgba(255,255,255,.035)!important;font-size:25px!important;z-index:3}.orbit-rank-list{position:relative;z-index:1;padding:5px 5px 7px!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:18px!important;background:rgba(0,4,12,.38)!important;box-shadow:inset 0 0 30px rgba(0,0,0,.25)!important;overflow:auto!important;max-height:min(52vh,540px)!important}.orbit-rank-row{position:relative;grid-template-columns:48px minmax(0,1fr) auto!important;gap:8px!important;min-height:51px!important;padding:8px 10px!important;margin:2px 0!important;border:0!important;border-bottom:1px solid rgba(255,255,255,.055)!important;border-radius:12px!important;background:transparent!important;transition:transform .15s ease,background .15s ease!important}.orbit-rank-row:last-child{border-bottom:0!important}.orbit-rank-pos{display:flex!important;align-items:center!important;justify-content:center!important;width:34px!important;height:34px!important;margin:auto!important;border:1px solid rgba(129,238,255,.18)!important;border-radius:50%!important;background:rgba(255,255,255,.025)!important;font-size:12px!important;font-weight:700!important;color:rgba(147,239,255,.72)!important;font-variant-numeric:tabular-nums}.orbit-rank-name{display:flex!important;align-items:center!important;gap:9px!important;min-width:0!important;font-size:14px!important;font-weight:500!important;letter-spacing:.015em!important}.orbit-rank-name:before{content:"";flex:0 0 29px;width:29px;height:29px;border:1px solid rgba(119,239,255,.48);border-radius:50%;background:radial-gradient(circle at 34% 28%,#dffcff 0 7%,#38e4f1 9% 18%,#167a9a 40%,#07162a 68%);box-shadow:inset -5px -6px 10px rgba(0,0,0,.25),0 0 12px rgba(55,222,255,.22)}.orbit-rank-score{font-size:16px!important;font-weight:650!important;letter-spacing:.025em!important;color:#d9fbff!important;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(75,229,255,.16)}.orbit-rank-row:nth-child(-n+3){min-height:66px!important;margin:6px 2px!important;padding:9px 10px!important;border:1px solid!important;border-radius:16px!important}.orbit-rank-row:nth-child(-n+3) .orbit-rank-pos{width:42px!important;height:42px!important;font-size:15px!important}.orbit-rank-row:nth-child(-n+3) .orbit-rank-name{font-size:15px!important;font-weight:650!important}.orbit-rank-row:nth-child(-n+3) .orbit-rank-name:before{width:36px;height:36px;flex-basis:36px}.orbit-rank-row:nth-child(-n+3) .orbit-rank-score{font-size:18px!important}.orbit-rank-row:nth-child(1){border-color:rgba(255,210,90,.65)!important;background:linear-gradient(90deg,rgba(117,77,0,.34),rgba(255,205,74,.07) 50%,rgba(117,77,0,.14))!important;box-shadow:0 0 20px rgba(255,191,42,.12),inset 0 0 18px rgba(255,216,92,.035)!important}.orbit-rank-row:nth-child(1) .orbit-rank-pos{color:#ffe18b!important;border-color:rgba(255,222,113,.75)!important;background:radial-gradient(circle,rgba(255,214,79,.18),rgba(119,74,0,.22))!important;box-shadow:0 0 18px rgba(255,204,73,.18)!important}.orbit-rank-row:nth-child(1) .orbit-rank-name:before{border-color:#ffd96c;background:radial-gradient(circle at 34% 28%,#fff5c5 0 7%,#ffd45c 10% 20%,#b36d14 45%,#2b1605 70%);box-shadow:0 0 16px rgba(255,197,56,.34)}.orbit-rank-row:nth-child(1) .orbit-rank-score{color:#ffe391!important;text-shadow:0 0 12px rgba(255,205,72,.30)}.orbit-rank-row:nth-child(1):before{content:"★";position:absolute;left:39px;top:1px;color:#ffe07a;font-size:10px;text-shadow:0 0 8px rgba(255,218,103,.8)}.orbit-rank-row:nth-child(2){border-color:rgba(174,222,255,.48)!important;background:linear-gradient(90deg,rgba(81,130,166,.24),rgba(173,226,255,.055) 55%,rgba(30,57,81,.12))!important}.orbit-rank-row:nth-child(2) .orbit-rank-pos{color:#e2f4ff!important;border-color:rgba(207,238,255,.60)!important}.orbit-rank-row:nth-child(2) .orbit-rank-name:before{border-color:#ccecff;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#a9dfff 10% 18%,#6656d9 42%,#14132e 70%)}.orbit-rank-row:nth-child(3){border-color:rgba(255,165,102,.48)!important;background:linear-gradient(90deg,rgba(131,70,34,.26),rgba(255,153,82,.055) 55%,rgba(65,34,20,.12))!important}.orbit-rank-row:nth-child(3) .orbit-rank-pos{color:#ffc69b!important;border-color:rgba(255,187,137,.58)!important}.orbit-rank-row:nth-child(3) .orbit-rank-name:before{border-color:#ffad73;background:radial-gradient(circle at 34% 28%,#ffe6d0 0 7%,#ff9e61 10% 18%,#17a7a4 46%,#102b2c 72%)}.orbit-rank-row.me{border:1px solid rgba(70,235,255,.55)!important;background:linear-gradient(90deg,rgba(28,194,214,.16),rgba(56,236,255,.045))!important;box-shadow:0 0 22px rgba(49,225,255,.10),inset 3px 0 0 #58efff!important}.orbit-rank-me{position:relative;z-index:1;grid-template-columns:1fr auto!important;margin-top:13px!important;padding:13px 14px!important;border:1px solid rgba(82,235,255,.52)!important;border-radius:15px!important;background:linear-gradient(110deg,rgba(17,123,142,.26),rgba(16,33,52,.84) 48%,rgba(30,87,109,.18))!important;box-shadow:0 0 24px rgba(49,224,255,.12),inset 0 0 20px rgba(76,233,255,.035)!important}.orbit-rank-me:after{content:"YOU";position:absolute;right:12px;top:-8px;padding:2px 8px;border:1px solid rgba(99,236,255,.35);border-radius:999px;background:#071521;color:#6ceeff;font-size:8px;font-weight:700;letter-spacing:.14em}.orbit-rank-me-label{color:rgba(105,237,255,.68)!important;font-weight:700!important}.orbit-rank-me-name{font-size:16px!important;font-weight:650!important;color:#f4fdff!important}.orbit-rank-me-side b{font-size:21px!important;color:#77f2ff!important;text-shadow:0 0 12px rgba(71,235,255,.22)}.orbit-rank-me-side span{font-size:11px!important;font-weight:700!important;letter-spacing:.08em!important;color:rgba(255,255,255,.52)!important}.orbit-rank-actions{position:relative;z-index:1;gap:10px!important;margin-top:11px!important}.orbit-rank-action{height:43px!important;border:1px solid rgba(112,235,255,.26)!important;border-radius:12px!important;background:linear-gradient(180deg,rgba(34,77,91,.54),rgba(9,25,37,.78))!important;color:rgba(235,253,255,.92)!important;font-size:12px!important;font-weight:650!important;letter-spacing:.08em!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important}.orbit-rank-action:active{transform:scale(.975);background:rgba(52,174,194,.22)!important}.orbit-rank-loading,.orbit-rank-empty{padding:38px 12px!important;color:rgba(147,235,245,.58)!important;letter-spacing:.05em!important}body.menu-start #orbitBottomNav{z-index:220!important}body.menu-start #orbitRankingsNav.active{color:#9df8ff!important;border-color:#8ff7ff!important;background:linear-gradient(180deg,rgba(68,225,237,.14),rgba(24,72,87,.22))!important;box-shadow:0 0 14px rgba(85,237,255,.48),0 0 28px rgba(85,237,255,.12)!important}@media(max-height:700px){#orbitRankingsModal{bottom:calc(72px + env(safe-area-inset-bottom))!important}.orbit-rank-panel{margin-top:42px!important}.orbit-rank-list{max-height:46vh!important}.orbit-rank-row{min-height:45px!important;padding-top:6px!important;padding-bottom:6px!important}.orbit-rank-row:nth-child(-n+3){min-height:56px!important}.orbit-rank-panel h2{font-size:31px!important}.orbit-rank-sub{margin-bottom:10px!important}.orbit-rank-me{padding:10px 12px!important}.orbit-rank-action{height:38px!important}}'''

          if '/* PREMIUM RANKINGS UI */' not in s:
              if marker not in s:
                  raise SystemExit('animation marker missing')
              s = s.replace(marker, premium + marker, 1)

          # Make the subtitle feel like a real leaderboard tab.
          s = s.replace("set('orbitRankingsSub',vi?'TOP NGƯỜI CHƠI TOÀN CẦU':'GLOBAL TOP PLAYERS')", "set('orbitRankingsSub',vi?'BXH TOÀN CẦU':'GLOBAL LEADERBOARD')")
          s = s.replace('>GLOBAL TOP PLAYERS</div>', '>GLOBAL LEADERBOARD</div>')

          # Bottom nav stays usable while the Rankings screen is open.
          nav_hook = "  ['orbitSkinsNav','orbitHomeNav'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',function(){var m=document.getElementById('orbitRankingsModal');if(m)m.classList.add('hidden')})});\n"
          gear_marker = "gear.addEventListener('pointerdown',stop);gear.addEventListener('click',openSettings);"
          if nav_hook.strip() not in s:
              if gear_marker not in s:
                  raise SystemExit('gear event marker missing')
              s = s.replace(gear_marker, nav_hook + gear_marker, 1)

          p.write_text(s, encoding='utf-8')
          print('premium rankings UI applied')
          PY
      - name: Validate generator syntax
        run: python3 -m py_compile tools/fix_simple_ui.py
      - name: Commit rankings redesign
        shell: bash
        run: |
          if git diff --quiet -- tools/fix_simple_ui.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Redesign global rankings screen'
          git push origin HEAD:main
