name: Build ORBIT BREAK Y8 Package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Y8 HTML5 build
        run: |
          set -euo pipefail
          rm -rf y8-build
          mkdir -p y8-build/assets
          cp index.html y8-build/index.html
          cp game-base.html y8-build/game-base.html
          cp assets/bobbey-game-studio-splash.jpg y8-build/assets/
          cp assets/bobbey-game-studio-splash.webp y8-build/assets/
          cp assets/orbit-break-icon.webp y8-build/assets/

          test -s y8-build/index.html
          test -s y8-build/game-base.html
          test -s y8-build/assets/bobbey-game-studio-splash.jpg
          test -s y8-build/assets/bobbey-game-studio-splash.webp
          test -s y8-build/assets/orbit-break-icon.webp

          grep -Fq 'https://cdn.y8.com/minimal-sdk/2-0/y8.min.js' y8-build/index.html
          grep -Fq "appId: '6a8af910b3a217f531663764'" y8-build/index.html
          grep -Fq "gameId: '281161'" y8-build/index.html
          grep -Fq "type: 'next'" y8-build/index.html

      - name: Upload Y8 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-Y8
          path: y8-build/
          if-no-files-found: error
          retention-days: 7
