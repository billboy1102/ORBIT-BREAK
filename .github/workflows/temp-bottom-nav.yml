name: Temporary bottom navigation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-bottom-nav.yml'

permissions:
  contents: write

jobs:
  patch-bottom-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bottom Home Skins Rankings navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')

          css='''#orbitBottomNav{position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom));padding:6px max(10px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr 1fr 1fr;align-items:stretch;background:rgba(7,12,22,.76);border-top:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:116;pointer-events:auto}body:not(.menu-start) #orbitBottomNav{display:none!important}.orbit-nav-btn{position:relative;border:0;background:transparent;color:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:300 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.06em;padding:5px 4px}.orbit-nav-btn svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.orbit-nav-btn.active{color:#fff;background:rgba(255,255,255,.045);border:2px solid rgba(255,255,255,.82);border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.58),0 0 22px rgba(96,236,255,.16);margin:-3px 7px 0}.orbit-nav-btn.active svg{filter:drop-shadow(0 0 8px rgba(255,255,255,.65))}.orbit-nav-btn:active{transform:scale(.96)}@media(max-height:620px){#orbitBottomNav{height:calc(72px + env(safe-area-inset-bottom))}.orbit-nav-btn svg{width:29px;height:29px}.orbit-nav-btn{font-size:10px}}'''
          if '#orbitBottomNav{' not in s:
              marker='@keyframes simpleTapPulse'
              if marker not in s: raise SystemExit('CSS marker not found')
              s=s.replace(marker,css+marker,1)

          dom='''\n  var nav=document.createElement('nav');nav.id='orbitBottomNav';nav.setAttribute('aria-label','Main menu');nav.innerHTML='<button class="orbit-nav-btn" id="orbitSkinsNav" aria-label="Skins"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 8 14l16 8 16-8-16-8Z"></path><path d="m8 22 16 8 16-8"></path><path d="m8 30 16 8 16-8"></path></svg><span id="orbitSkinsLabel">SKINS</span></button><button class="orbit-nav-btn active" id="orbitHomeNav" aria-label="Home"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 22 24 8l17 14v19H29V29H19v12H7V22Z"></path></svg><span id="orbitHomeLabel">HOME</span></button><button class="orbit-nav-btn" id="orbitRankingsNav" aria-label="Rankings"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 39V27h7v12H9Zm12 0V18h7v21h-7Zm12 0V9h7v30h-7Z"></path></svg><span id="orbitRankingsLabel">RANKINGS</span></button>';document.body.appendChild(nav);\n'''
          marker="  document.body.appendChild(gear);\n"
          if 'id=\'orbitBottomNav\'' not in s and 'orbitBottomNav' not in s[s.find(marker):s.find(marker)+5000]:
              if marker not in s: raise SystemExit('DOM marker not found')
              s=s.replace(marker,marker+dom,1)

          lang_old="set('orbitGuideOk',tx.ok);set('orbitLanguageBtn',vi?'VI':'EN');"
          lang_new="set('orbitGuideOk',tx.ok);set('orbitLanguageBtn',vi?'VI':'EN');set('orbitHomeLabel',vi?'TRANG CHỦ':'HOME');set('orbitSkinsLabel',vi?'GIAO DIỆN':'SKINS');set('orbitRankingsLabel',vi?'XẾP HẠNG':'RANKINGS');"
          if lang_old in s and "orbitHomeLabel',vi?" not in s:
              s=s.replace(lang_old,lang_new,1)

          event_marker="  gear.addEventListener('pointerdown',stop);gear.addEventListener('click',openSettings);"
          event_code="""  ['orbitSkinsNav','orbitHomeNav','orbitRankingsNav'].forEach(function(id){var b=document.getElementById(id);if(b){b.addEventListener('pointerdown',stop);b.addEventListener('click',function(e){stop(e);document.querySelectorAll('.orbit-nav-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active')})}});\n  var homeNav=document.getElementById('orbitHomeNav');if(homeNav)homeNav.addEventListener('click',function(){var s=document.getElementById('start');if(s)s.classList.remove('hidden')});\n"""
          if event_marker not in s: raise SystemExit('event marker not found')
          if "['orbitSkinsNav','orbitHomeNav','orbitRankingsNav']" not in s:
              s=s.replace(event_marker,event_code+event_marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit bottom navigation
        shell: bash
        run: |
          if git diff --quiet -- tools/fix_simple_ui.py; then
            echo 'No bottom navigation changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Add bottom Home Skins and Rankings navigation'
          git push
