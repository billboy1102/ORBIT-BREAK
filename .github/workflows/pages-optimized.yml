name: Deploy optimized ORBIT BREAK Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game-base.html'
      - '_perf_patch.py'
      - '.github/workflows/pages-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply desktop performance optimization
        run: python3 _perf_patch.py

      - name: Let regular deployment finish first
        run: sleep 12

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload optimized site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy optimized site
        id: deployment
        uses: actions/deploy-pages@v4
