name: Cleanup launcher installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary launcher workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/install-supplied-launcher-icon.yml .github/workflows/cleanup-launcher-installer.yml
          git commit -m 'Clean up temporary launcher installer'
          git push origin HEAD:main
