name: Apply supplied launcher icon

on:
  push:
    branches: [launcher-icon-replace-tmp]
    paths:
      - '.github/workflows/apply-launcher-icon-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify staged launcher icon
        shell: bash
        run: |
          cat .launcher-upload/part07_*.b64 | base64 --decode > /tmp/part07.bin
          echo "88300729642a8dae9ff74026d9fc4aa9db372c76e58d03e8c0ea13f9f74b25d2  /tmp/part07.bin" | sha256sum -c -
          cat .launcher-upload/part*.b64 | base64 --decode > /tmp/orbit-break-icon.webp
          echo "e0e1536e77c72463d451ad3e112d1b027000b6c16f4a4b500562a4b4c997f24c  /tmp/orbit-break-icon.webp" | sha256sum -c -
          stat -c '%s bytes' /tmp/orbit-break-icon.webp
