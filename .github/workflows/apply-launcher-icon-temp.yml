name: Apply supplied launcher icon

on:
  push:
    branches: [launcher-icon-replace-tmp]
    paths:
      - '.github/workflows/apply-launcher-icon-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose staged launcher parts
        shell: bash
        run: |
          for f in .launcher-upload/part*.b64; do
            printf '%s ' "$f"
            base64 --decode "$f" | sha256sum
          done
          cat .launcher-upload/part*.b64 | base64 --decode > /tmp/orbit-break-icon.webp
          sha256sum /tmp/orbit-break-icon.webp
          stat -c '%s bytes' /tmp/orbit-break-icon.webp
