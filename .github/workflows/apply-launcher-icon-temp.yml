name: Apply supplied launcher icon

on:
  push:
    branches: [launcher-icon-replace-tmp]
    paths:
      - '.github/workflows/apply-launcher-icon-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild launcher icon
        shell: bash
        run: |
          cat .launcher-upload/part*.b64 | base64 --decode > assets/orbit-break-icon.webp
          echo "e0e1536e77c72463d451ad3e112d1b027000b6c16f4a4b500562a4b4c997f24c  assets/orbit-break-icon.webp" | sha256sum -c -
          rm -rf .launcher-upload
          rm -f .github/workflows/apply-launcher-icon-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace launcher icon with supplied artwork"
          git push
