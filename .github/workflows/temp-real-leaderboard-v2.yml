name: Temporary real leaderboard patch v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-real-leaderboard-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/temp_patch_leaderboard.py
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- tools/fix_simple_ui.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Add global player rankings backed by Supabase'
          git push
