name: Temporary Bobbey splash and menu flow patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-apply-bobbey-splash-menu-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply exact splash and two-tap retry flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if new in s:
                  print(path, label, 'already patched')
                  return
              if old not in s:
                  raise SystemExit(f'{path}: {label} pattern not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print(path, label, 'patched')

          # WEB / ANDROID outer splash. The JPEG itself is used unchanged.
          replace_once('index.html',
              '#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a9faff;font:900 12px system-ui;letter-spacing:2px;background:#050711}\n#boot.hide{display:none}',
              '#boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#03111a;overflow:hidden}\n#boot img{width:100%;height:100%;object-fit:contain;display:block}\n#boot.hide{display:none}',
              'splash css')
          replace_once('index.html',
              '<div id="boot">SYNCING BEAT...</div>',
              '<div id="boot"><img src="assets/bobbey-game-studio-splash.jpg" alt=""></div>',
              'splash image')
          replace_once('index.html',
              "const boot=document.getElementById('boot');\nlet patched=false;",
              "const boot=document.getElementById('boot');\nconst bootStarted=performance.now();\nconst finishBoot=()=>{boot.classList.add('hide');frame.classList.add('ready')};\nlet patched=false;",
              'splash timer')
          replace_once('index.html',
              "if(patched){boot.classList.add('hide');frame.classList.add('ready');return}",
              "if(patched){setTimeout(finishBoot,Math.max(0,1800-(performance.now()-bootStarted)));return}",
              'splash minimum duration')

          # Windows splash uses the same exact file from ../assets.
          replace_once('desktop/index-windows.html',
              '#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a9faff;font:900 12px system-ui;letter-spacing:2px;background:#050711}\n#boot.hide{display:none}',
              '#boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#03111a;overflow:hidden}\n#boot img{width:100%;height:100%;object-fit:contain;display:block}\n#boot.hide{display:none}',
              'windows splash css')
          replace_once('desktop/index-windows.html',
              '<div id="boot">LOADING...</div>',
              '<div id="boot"><img src="../assets/bobbey-game-studio-splash.jpg" alt=""></div>',
              'windows splash image')
          replace_once('desktop/index-windows.html',
              "const boot=document.getElementById('boot');\nlet patched=false;",
              "const boot=document.getElementById('boot');\nconst bootStarted=performance.now();\nconst finishBoot=()=>{boot.classList.add('hide');frame.classList.add('ready')};\nlet patched=false;",
              'windows splash timer')
          replace_once('desktop/index-windows.html',
              "if(patched){boot.classList.add('hide');frame.classList.add('ready');return}",
              "if(patched){setTimeout(finishBoot,Math.max(0,1800-(performance.now()-bootStarted)));return}",
              'windows splash minimum duration')

          # Base game: first tap on Game Over returns to menu, second tap from menu starts a new run.
          replace_once('game-base.html',
              "function tap(e){if(e)e.preventDefault();if(state==='menu'||state==='over'){reset();return}if(state!=='play')return;let tol=clamp(.30-hits*.004,.18,.30),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'TOO LATE')}",
              "function returnToMenu(){state='menu';el.score.style.display='none';el.over.classList.add('hidden');el.start.classList.remove('hidden');document.body.classList.remove('menu-over');document.body.classList.add('menu-start')}function tap(e){if(e)e.preventDefault();if(state==='over'){returnToMenu();return}if(state==='menu'){reset();return}if(state!=='play')return;let tol=clamp(.30-hits*.004,.18,.30),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'TOO LATE')}",
              'base game over to menu')

          # Web / Android rhythm addon overrides tap, so patch its active handler too.
          replace_once('index.html',
              "tap=function(e){if(e)e.preventDefault();if(state==='menu'||state==='over'){reset();return}if(state!=='play')return;let tol=clamp(speed*.075,.26,.42),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'MISS BEAT')};",
              "tap=function(e){if(e)e.preventDefault();if(state==='over'){rhythmStop();state='menu';document.body.classList.remove('menu-over');document.body.classList.add('menu-start');if(el.score)el.score.style.display='none';el.over.classList.add('hidden');el.start.classList.remove('hidden');return}if(state==='menu'){reset();return}if(state!=='play')return;let tol=clamp(speed*.075,.26,.42),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'MISS BEAT')};",
              'web game over to menu')

          replace_once('desktop/index-windows.html',
              "tap=function(e){if(e)e.preventDefault();if(state==='menu'||state==='over'){reset();return}if(state!=='play')return;let tol=clamp(speed*.075,.26,.42),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'MISS BEAT')};",
              "tap=function(e){if(e)e.preventDefault();if(state==='over'){rhythmStop();state='menu';document.body.classList.remove('menu-over');document.body.classList.add('menu-start');if(el.score)el.score.style.display='none';el.over.classList.add('hidden');el.start.classList.remove('hidden');return}if(state==='menu'){reset();return}if(state!=='play')return;let tol=clamp(speed*.075,.26,.42),d=Math.abs(progress-goal);d<=tol?success(d):die(progress<goal?'TOO EARLY':'MISS BEAT')};",
              'windows game over to menu')

          # Keep the Game Over instruction truthful after changing the flow.
          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')
          old="retry:vi?'CHẠM ĐỂ CHƠI LẠI':'TAP TO RETRY'"
          new="retry:vi?'CHẠM ĐỂ VỀ MENU':'TAP TO MENU'"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('tools/fix_simple_ui.py: retry language pattern not found')
          # Also update the fallback English text before language sync runs.
          s=s.replace('TAP TO RETRY</div>', 'TAP TO MENU</div>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patched sources
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          grep -Fq 'assets/bobbey-game-studio-splash.jpg' index.html
          grep -Fq '../assets/bobbey-game-studio-splash.jpg' desktop/index-windows.html
          grep -Fq "if(state==='over'){rhythmStop();state='menu'" index.html
          grep -Fq "if(state==='over'){rhythmStop();state='menu'" desktop/index-windows.html
          grep -Fq "function returnToMenu(){state='menu'" game-base.html
          grep -Fq "CHẠM ĐỂ VỀ MENU" tools/fix_simple_ui.py
          test -f assets/bobbey-game-studio-splash.jpg

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html desktop/index-windows.html game-base.html tools/fix_simple_ui.py
          git commit -m 'Show Bobbey splash and return Game Over to menu'
          git push
