name: Temporary game over v2 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-gameover-layout-v2.yml'

permissions:
  contents: write

jobs:
  patch-gameover-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raise score and best, remove combo, lower retry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_css = "#gameover{position:absolute;left:50%;top:max(78px,9vh);transform:translateX(-50%);width:min(92vw,560px);z-index:30;pointer-events:none}#gameover .over-backdrop{display:none!important}#gameover .over-panel{position:relative;padding:0!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;backdrop-filter:none!important}#gameover .over-panel:before,#gameover .over-emblem{display:none!important}#gameover .over-title{position:relative;margin:0;font-size:clamp(42px,12vw,70px);line-height:.94;font-weight:650;letter-spacing:-2px;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#fff!important;text-shadow:0 0 15px rgba(255,255,255,.26),0 0 30px rgba(89,234,255,.13);filter:none!important}#gameover .over-score{margin-top:12px;text-align:center}#gameover .over-score span{display:block;font-size:clamp(11px,3vw,16px);font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.55)}#gameover .over-score b{display:block;margin-top:2px;font-size:clamp(54px,15vw,84px);line-height:1;font-weight:300;color:#fff;letter-spacing:-2px}#gameover .over-meta{display:flex;align-items:center;justify-content:center;margin-top:7px;white-space:nowrap;color:rgba(255,255,255,.76);font-size:clamp(15px,4vw,23px);font-weight:450;letter-spacing:1px}#gameover .over-meta b{color:#fff;font-weight:550}#gameover .cta{position:fixed!important;left:50%!important;top:62vh!important;transform:translateX(-50%)!important;display:block!important;width:auto!important;height:auto!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;color:rgba(255,255,255,.62)!important;font-size:clamp(20px,5.3vw,32px)!important;font-weight:350!important;letter-spacing:1px!important;white-space:nowrap}#gameover .cta:after,#gameover .retry-icon,#gameover .hidden-combo{display:none!important}@media(max-height:650px){#gameover{top:max(62px,7vh)}#gameover .over-title{font-size:clamp(36px,10vw,54px)}#gameover .over-score{margin-top:7px}#gameover .over-score b{font-size:48px}#gameover .over-meta{margin-top:4px;font-size:15px}#gameover .cta{top:64vh!important;font-size:18px!important}}"

          css_pattern = r"  gameOverTopStyle\.textContent='[^\n]*';"
          replacement = "  gameOverTopStyle.textContent=" + repr(new_css) + ";"
          text, count = re.subn(css_pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one gameOverTopStyle assignment, replaced {count}')

          html_pattern = r"    over\.innerHTML='[^\n]*';"
          html_replacement = "    over.innerHTML='<div class=\"over-panel\"><div class=\"over-title\">ORBIT LOST</div><div class=\"over-score\"><span>SCORE</span><b id=\"finalScore\">0</b></div><div class=\"over-meta\"><span>BEST <b id=\"highScore\">0</b></span></div><b id=\"finalCombo\" class=\"hidden-combo\">x1</b><div class=\"cta\">TAP TO RETRY</div></div>';"
          text, count = re.subn(html_pattern, html_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one gameover innerHTML line, replaced {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise score and best, remove combo, lower retry prompt'
          git push

# trigger v2
