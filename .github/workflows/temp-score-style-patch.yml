name: Temporary score style patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-score-style-patch.yml'

permissions:
  contents: write

jobs:
  patch-score-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace gameplay HUD and scoring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Base game: replace the two top-left score/combo cards with one plain centered score.
          base = Path('game-base.html')
          text = base.read_text(encoding='utf-8')

          old_hud = '<div class="top"><div class="group"><div class="card"><div class="big" id="score">0</div><div class="small">SCORE</div></div><div class="card right"><div class="big" id="combo">x1</div><div class="small">COMBO</div></div></div><div class="pill" id="themeBadge">NEON CITY</div></div>'
          new_hud = '<div class="game-score" id="score">0</div><div class="hidden" id="combo">x1</div><div class="hidden" id="themeBadge">NEON CITY</div>'
          if old_hud not in text:
              raise SystemExit('game-base.html: gameplay HUD markup not found')
          text = text.replace(old_hud, new_hud, 1)

          css_marker = '.bottom{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.7px;opacity:.38;white-space:nowrap}'
          score_css = '.game-score{position:fixed;left:50%;top:max(92px,15vh);transform:translateX(-50%);z-index:8;font-family:Arial,Helvetica,sans-serif;font-size:clamp(60px,16vw,96px);font-weight:300;line-height:1;letter-spacing:.02em;color:#fff;text-align:center;text-shadow:0 0 18px rgba(255,255,255,.12)}'
          if score_css not in text:
              if css_marker not in text:
                  raise SystemExit('game-base.html: CSS insertion marker not found')
              text = text.replace(css_marker, score_css + css_marker, 1)

          old_success = "function success(d){const old={...anchor};history.push({x1:old.x,y1:old.y,x2:target.x,y2:target.y,l:1});if(history.length>90)history.shift();anchor={x:target.x,y:target.y};startAngle=Math.atan2(old.y-anchor.y,old.x-anchor.x);progress=0;hits++;let perfect=d<Math.max(.075,.13-hits*.0015);if(perfect){combo++;score+=20*combo;toast('PERFECT',THEMES[themeNow].a)}else{score+=10*combo;toast('GOOD',THEMES[themeNow].b)}bestCombo=Math.max(bestCombo,combo);speed=Math.min(4.15,1.72+hits*.055);flash=perfect?.52:.32;shake=perfect?9:5;burst(anchor.x,anchor.y,perfect?28:16);chooseGoal();buildTarget();updateHUD()}"
          new_success = "function success(d){const old={...anchor};history.push({x1:old.x,y1:old.y,x2:target.x,y2:target.y,l:1});if(history.length>90)history.shift();anchor={x:target.x,y:target.y};startAngle=Math.atan2(old.y-anchor.y,old.x-anchor.x);progress=0;hits++;let perfect=d<Math.max(.075,.13-hits*.0015);score+=1;combo=1;if(perfect){toast('PERFECT',THEMES[themeNow].a)}else{toast('GOOD',THEMES[themeNow].b)}bestCombo=1;speed=Math.min(4.15,1.72+hits*.055);flash=perfect?.52:.32;shake=perfect?9:5;burst(anchor.x,anchor.y,perfect?28:16);chooseGoal();buildTarget();updateHUD()}"
          if old_success not in text:
              raise SystemExit('game-base.html: base success() not found')
          text = text.replace(old_success, new_success, 1)
          base.write_text(text, encoding='utf-8')

          # 2) Web wrapper rhythm override: every successful tap is exactly +1 point and combo is disabled.
          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          old = "  const error=delta/Math.max(.01,speed),perfect=error<=.055;if(perfect){combo++;score+=20*combo;toast('BEAT PERFECT','#8bffd5')}else{score+=10*combo;toast('ON BEAT','#ffe47a')}rhythmHit(perfect);\n  bestCombo=Math.max(bestCombo,combo);speed=Math.min(5.35,2.15+hits*.09);flash=perfect?.52:.32;burst(anchor.x,anchor.y,perfect?28:16);if(navigator.vibrate)navigator.vibrate(perfect?16:8);chooseGoal();buildTarget();updateHUD();"
          new = "  const error=delta/Math.max(.01,speed),perfect=error<=.055;score+=1;combo=1;if(perfect){toast('BEAT PERFECT','#8bffd5')}else{toast('ON BEAT','#ffe47a')}rhythmHit(perfect);\n  bestCombo=1;speed=Math.min(5.35,2.15+hits*.09);flash=perfect?.52:.32;burst(anchor.x,anchor.y,perfect?28:16);if(navigator.vibrate)navigator.vibrate(perfect?16:8);chooseGoal();buildTarget();updateHUD();"
          if old not in text:
              raise SystemExit('index.html: rhythm success scoring block not found')
          text = text.replace(old, new, 1)
          idx.write_text(text, encoding='utf-8')
          PY

      - name: Commit gameplay score changes
        shell: bash
        run: |
          if git diff --quiet -- game-base.html index.html; then
            echo 'No gameplay score changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html index.html
          git commit -m 'Use single centered score and one point per hit'
          git push
