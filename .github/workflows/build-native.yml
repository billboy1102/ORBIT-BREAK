name: Build Windows and Android

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game-base.html'
      - 'package.json'
      - 'desktop/**'
      - 'tools/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply louder multi-track music
        run: python tools/apply_native_music_pack.py desktop/index-windows.html

      - name: Install Electron builder
        run: npm install --no-save electron@latest electron-builder@latest

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-Windows
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set automatic version
        shell: bash
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Android versionCode=${{ github.run_number }} versionName=1.0.${{ github.run_number }}"

      - name: Check Android signing secrets
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Android release signing: enabled"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Android release signing: disabled because one or more GitHub Secrets are missing"
          fi

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Prepare web assets
        run: |
          mkdir -p web
          cp index.html game-base.html web/
          python3 tools/apply_native_music_pack.py web/index.html

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Force portrait orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<activity'
          i = s.find(marker)
          if i >= 0 and 'android:screenOrientation=' not in s[i:s.find('>', i)]:
              j = s.find('>', i)
              s = s[:j] + '\n            android:screenOrientation="portrait"' + s[j:]
              p.write_text(s)
          PY

      - name: Configure Android version and signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE"))
                  versionName System.getenv("VERSION_NAME")
              }
          }
          GRADLE

          if [ "$SIGNING_READY" = "true" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> "$GITHUB_ENV"
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          fi

      - name: Build Android packages
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          if [ "$SIGNING_READY" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect Android packages
        shell: bash
        run: |
          mkdir -p dist/android
          if [ "$SIGNING_READY" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/android/ORBIT-BREAK-v${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/android/ORBIT-BREAK-v${VERSION_NAME}.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/ORBIT-BREAK-v${VERSION_NAME}-debug.apk"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-APK-v${{ env.VERSION_NAME }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-AAB-v${{ env.VERSION_NAME }}
          path: dist/android/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Signing setup reminder
        if: env.SIGNING_READY != 'true'
        run: |
          echo "Signed AAB skipped. Add these repository Actions secrets:"
          echo "ANDROID_KEYSTORE_BASE64"
          echo "ANDROID_KEYSTORE_PASSWORD"
          echo "ANDROID_KEY_ALIAS"
          echo "ANDROID_KEY_PASSWORD"
