name: Build Windows and Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply native music and current web UI
        run: |
          python tools/apply_native_music_pack.py desktop/index-windows.html
          python tools/fix_simple_ui.py desktop/index-windows.html
          python tools/fix_rankings_position.py desktop/index-windows.html
          python tools/fix_branding.py desktop/index-windows.html

      - name: Verify Windows Bobbey splash
        shell: bash
        run: |
          test -s assets/bobbey-game-studio-splash.webp
          grep -Fq '../assets/bobbey-game-studio-splash.webp' desktop/index-windows.html

      - name: Install Electron builder
        run: npm install --no-save electron@latest electron-builder@latest

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-Windows
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set automatic version
        shell: bash
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Android versionCode=${{ github.run_number }} versionName=1.0.${{ github.run_number }}"

      - name: Check Android signing secrets
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Android release signing: enabled"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Android release signing: disabled; AAB will still be built unsigned"
          fi

      - name: Install Capacitor Android and image tools
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest sharp

      - name: Prepare web assets from current web source
        run: |
          rm -rf web
          mkdir -p web
          cp index.html game-base.html web/
          if [ -d assets ]; then cp -R assets web/; fi
          python3 tools/apply_native_music_pack.py web/index.html
          python3 tools/fix_simple_ui.py web/index.html
          python3 tools/fix_rankings_position.py web/index.html
          python3 tools/fix_branding.py web/index.html

      - name: Verify Android web UI and Bobbey splash
        run: |
          test -s web/assets/bobbey-game-studio-splash.webp
          test -s assets/orbit-break-icon.webp
          grep -Fq 'assets/bobbey-game-studio-splash.webp' web/index.html
          ! grep -Fq 'assets/bobbey-game-studio-splash.jpg' web/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          required = [
              'orbitSkinsModal',
              'orbitRankingsModal',
              'orbitRankRename',
              'orbitNameModal',
              '#orbitNameModal:not(.hidden){z-index:750!important',
              'simpleStartTap',
              'touch-action:pan-y!important',
              'ORBIT_LB_URL',
              'DISTINCT ORB SKINS',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Android UI is missing current web features: ' + ', '.join(missing))
          forbidden = [
              'orbitVibrationToggle',
              'orbitVibrationLabel',
              'bottom:calc(84px + env(safe-area-inset-bottom))!important;inset:auto!important;',
          ]
          bad = [x for x in forbidden if x in html]
          if bad:
              raise SystemExit('Android UI still contains obsolete web UI: ' + ', '.join(bad))
          print('Android web assets contain current UI and the fixed Bobbey splash.')
          PY

      - name: Validate Android wrapper JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          start = html.find('<script>') + len('<script>')
          end = html.rfind('</script>')
          if start < len('<script>') or end <= start:
              raise SystemExit('Unable to extract wrapper script')
          Path('/tmp/orbit-android-wrapper.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/orbit-android-wrapper.js

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply ORBIT BREAK launcher icon and blank system splash
        shell: bash
        run: |
          # Remove every generated/default launcher asset so the old blue Capacitor icon can never survive the build.
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'splash*' \) -delete || true

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function main(){
            const src = 'assets/orbit-break-icon.webp';
            const legacy = {mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192};
            const foreground = {mdpi:108, hdpi:162, xhdpi:216, xxhdpi:324, xxxhdpi:432};
            for (const [density,size] of Object.entries(legacy)) {
              const dir = `android/app/src/main/res/mipmap-${density}`;
              fs.mkdirSync(dir,{recursive:true});
              await sharp(src).resize(size,size,{fit:'cover'}).png().toFile(path.join(dir,'ic_launcher.png'));
              await sharp(src).resize(size,size,{fit:'cover'}).png().toFile(path.join(dir,'ic_launcher_round.png'));
            }
            for (const [density,size] of Object.entries(foreground)) {
              const dir = `android/app/src/main/res/mipmap-${density}`;
              fs.mkdirSync(dir,{recursive:true});
              await sharp(src).resize(size,size,{fit:'cover'}).png().toFile(path.join(dir,'ic_launcher_foreground.png'));
            }
            fs.mkdirSync('dist/store',{recursive:true});
            await sharp(src).resize(512,512,{fit:'cover'}).png().toFile('dist/store/ORBIT-BREAK-Google-Play-Icon-512.png');
          }
          main().catch(err=>{console.error(err);process.exit(1)});
          NODE

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/orbit_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          mkdir -p android/app/src/main/res/values android/app/src/main/res/drawable
          cat > android/app/src/main/res/values/orbit_brand_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="orbit_icon_background">#050711</color>
              <color name="orbit_splash_background">#03111A</color>
          </resources>
          XML

          # Android requires a native launch splash. Make its icon fully transparent so the game icon never appears while entering the game.
          cat > android/app/src/main/res/drawable/orbit_splash_blank.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/res/values/styles.xml')
          s = p.read_text(encoding='utf-8')
          launch = '''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="windowSplashScreenBackground">@color/orbit_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/orbit_splash_blank</item>
              <item name="windowSplashScreenAnimationDuration">1</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              <item name="android:windowBackground">@color/orbit_splash_background</item>
          </style>'''
          pattern = r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>'
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('Capacitor launch theme not found')
          s = re.sub(pattern, launch, s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Force portrait orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<activity'
          i = s.find(marker)
          if i >= 0 and 'android:screenOrientation=' not in s[i:s.find('>', i)]:
              j = s.find('>', i)
              s = s[:j] + '\n            android:screenOrientation="portrait"' + s[j:]
              p.write_text(s)
          PY

      - name: Verify Android branding
        shell: bash
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s dist/store/ORBIT-BREAK-Google-Play-Icon-512.png
          grep -Fq 'windowSplashScreenAnimatedIcon">@drawable/orbit_splash_blank' android/app/src/main/res/values/styles.xml
          grep -Fq 'windowSplashScreenBackground">@color/orbit_splash_background' android/app/src/main/res/values/styles.xml
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          ! grep -R -Fq '@drawable/splash' android/app/src/main/res/values/styles.xml
          echo 'ORBIT BREAK launcher icon installed; native system splash is blank/dark; Bobbey artwork follows in WebView.'

      - name: Configure Android version and signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE"))
                  versionName System.getenv("VERSION_NAME")
              }
          }
          GRADLE

          if [ "$SIGNING_READY" = "true" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> "$GITHUB_ENV"
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          fi

      - name: Build Android packages
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          if [ "$SIGNING_READY" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug bundleRelease --no-daemon
          fi

      - name: Collect Android packages
        shell: bash
        run: |
          mkdir -p dist/android
          if [ "$SIGNING_READY" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/android/ORBIT-BREAK-v${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/android/ORBIT-BREAK-v${VERSION_NAME}.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/ORBIT-BREAK-v${VERSION_NAME}-debug.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/android/ORBIT-BREAK-v${VERSION_NAME}-unsigned.aab"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-APK-v${{ env.VERSION_NAME }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-AAB-v${{ env.VERSION_NAME }}
          path: dist/android/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play icon
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-BREAK-Google-Play-Icon-512
          path: dist/store/ORBIT-BREAK-Google-Play-Icon-512.png
          if-no-files-found: error
          retention-days: 30

      - name: Signing setup reminder
        if: env.SIGNING_READY != 'true'
        run: |
          echo "AAB was built unsigned. Add these repository Actions secrets for a signed release AAB:"
          echo "ANDROID_KEYSTORE_BASE64"
          echo "ANDROID_KEYSTORE_PASSWORD"
          echo "ANDROID_KEY_ALIAS"
          echo "ANDROID_KEY_PASSWORD"
