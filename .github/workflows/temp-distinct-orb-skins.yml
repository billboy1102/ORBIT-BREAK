name: Temporary distinct orb skins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-distinct-orb-skins.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Redesign gameplay orb skins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('game-base.html')
          s=p.read_text(encoding='utf-8')

          skins="""const ORB_SKINS=[{name:'NEON PULSE',type:'classic',a:'#62f6ff',b:'#ff45cf',ea:'#e8ffff',eb:'#ffe1f6',glow:18},{name:'REACTOR CORE',type:'ring',a:'#49f3ff',b:'#9dff4a',ea:'#e6fdff',eb:'#efffd7',glow:23},{name:'PRISM SHARD',type:'crystal',a:'#9a7cff',b:'#49e7ff',ea:'#eee7ff',eb:'#dfffff',glow:21},{name:'PIXEL BYTE',type:'pixel',a:'#52ff9a',b:'#ffd84d',ea:'#e3ffee',eb:'#fff6c8',glow:13},{name:'VOID EYE',type:'eye',a:'#ff4ecb',b:'#7b68ff',ea:'#ffe3f8',eb:'#e8e3ff',glow:24},{name:'STAR FORGE',type:'star',a:'#ffd34e',b:'#ff5d4a',ea:'#fff6c8',eb:'#ffe3dd',glow:24},{name:'ECLIPSE',type:'eclipse',a:'#f4f7ff',b:'#83a4ff',ea:'#ffffff',eb:'#e7edff',glow:20},{name:'COMET DASH',type:'comet',a:'#42eaff',b:'#ff8a3d',ea:'#ddfbff',eb:'#ffe8d8',glow:25},{name:'HEX TECH',type:'hex',a:'#37ffc8',b:'#2e8cff',ea:'#dcfff5',eb:'#dceaff',glow:18},{name:'GHOST PHASE',type:'ghost',a:'#eefcff',b:'#bea8ff',ea:'#ffffff',eb:'#f0eaff',glow:28},{name:'DUALITY',type:'dual',a:'#ff5c9f',b:'#55e8ff',ea:'#ffe2ee',eb:'#e0fbff',glow:20},{name:'TARGET LOCK',type:'target',a:'#ff596e',b:'#ffffff',ea:'#ffe1e5',eb:'#ffffff',glow:18}];"""
          s,n=re.subn(r"const ORB_SKINS=\[.*?\];",skins,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ORB_SKINS replace failed')

          old="function skinOrb(x,y,r,fill,edge,glow){ctx.save();ctx.shadowColor=fill;ctx.shadowBlur=glow||18;circle(x,y,r,fill,edge,2);ctx.restore()}"
          new="""function skinPoly(r,n,rot,fill,edge){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*TAU/n,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke()}
function skinStar(r,fill,edge,rot){ctx.beginPath();for(let i=0;i<12;i++){let rr=i%2?r:r*.46,a=rot+i*Math.PI/6,x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=1.8;ctx.stroke()}
function skinOrb(x,y,r,fill,edge,skin,phase=0){ctx.save();ctx.translate(x,y);ctx.shadowColor=fill;ctx.shadowBlur=skin.glow||18;let q=phase||0;if(skin.type==='ring'){circle(0,0,r,null,fill,3.2);circle(0,0,r*.52,null,edge,2);circle(0,0,r*.18,edge);ctx.rotate(q);arc(0,0,r*1.28,-.7,.7,fill,2)}else if(skin.type==='crystal'){ctx.rotate(Math.PI/4+q*.08);skinPoly(r*1.08,4,0,fill,edge);ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-r*.75,0);ctx.lineTo(0,-r*.75);ctx.lineTo(r*.75,0);ctx.stroke()}else if(skin.type==='pixel'){ctx.shadowBlur=(skin.glow||12)*.7;ctx.fillStyle=fill;ctx.fillRect(-r*.72,-r*.72,r*1.44,r*1.44);ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.strokeRect(-r*.72,-r*.72,r*1.44,r*1.44);ctx.fillStyle=edge;let z=r*.34;ctx.fillRect(-r*.92,-z/2,z,z);ctx.fillRect(r*.58,-z/2,z,z);ctx.fillRect(-z/2,-r*.92,z,z);ctx.fillRect(-z/2,r*.58,z,z)}else if(skin.type==='eye'){ctx.rotate(q*.12);ctx.beginPath();ctx.ellipse(0,0,r*1.12,r*.70,0,0,TAU);ctx.fillStyle='rgba(4,8,18,.92)';ctx.fill();ctx.strokeStyle=fill;ctx.lineWidth=2.6;ctx.stroke();circle(0,0,r*.46,fill,edge,1.6);circle(r*.10,-r*.10,r*.13,'#ffffff')}else if(skin.type==='star'){ctx.rotate(q*.22);skinStar(r*1.08,fill,edge,0);circle(0,0,r*.23,'#ffffffaa')}else if(skin.type==='eclipse'){circle(0,0,r,fill,edge,2);ctx.globalCompositeOperation='destination-out';circle(r*.42,-r*.15,r*.82,'#000');ctx.globalCompositeOperation='source-over';arc(0,0,r*.98,-1.5,1.45,edge,1.7)}else if(skin.type==='comet'){ctx.rotate(q*.14);ctx.beginPath();ctx.moveTo(-r*1.8,0);ctx.lineTo(-r*.45,-r*.48);ctx.lineTo(-r*.45,r*.48);ctx.closePath();ctx.fillStyle=rgba(fill,.38);ctx.fill();circle(0,0,r,fill,edge,2);circle(r*.2,-r*.2,r*.18,'#ffffffaa')}else if(skin.type==='hex'){ctx.rotate(q*.10);skinPoly(r*1.03,6,Math.PI/6,fill,edge);circle(0,0,r*.30,'rgba(3,12,24,.76)',edge,1.5);ctx.strokeStyle=edge;ctx.lineWidth=1;for(let i=0;i<3;i++){let a=i*TAU/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38);ctx.lineTo(Math.cos(a)*r*.80,Math.sin(a)*r*.80);ctx.stroke()}}else if(skin.type==='ghost'){ctx.globalAlpha=.72;circle(0,0,r,rgba(fill,.34),edge,2);circle(0,0,r*.68,null,fill,1.5);circle(-r*.24,-r*.10,r*.12,'#ffffff');circle(r*.24,-r*.10,r*.12,'#ffffff');arc(0,r*.10,r*.36,.25,Math.PI-.25,fill,1.4)}else if(skin.type==='dual'){ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2);ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.beginPath();ctx.arc(0,0,r,Math.PI/2,Math.PI*1.5);ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle=edge;ctx.fill();circle(0,0,r,null,'#ffffffcc',1.6);circle(0,-r*.48,r*.14,edge);circle(0,r*.48,r*.14,fill)}else if(skin.type==='target'){circle(0,0,r,null,fill,3);circle(0,0,r*.62,null,edge,2);circle(0,0,r*.27,fill);ctx.strokeStyle=edge;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-r*1.25,0);ctx.lineTo(r*1.25,0);ctx.moveTo(0,-r*1.25);ctx.lineTo(0,r*1.25);ctx.stroke()}else{circle(0,0,r,fill,edge,2);circle(-r*.30,-r*.32,r*.18,'#ffffff99')}ctx.restore()}
function skinTrail(x,y,life,skin){let r=5*life,c=rgba(skin.a,life*.60);if(skin.type==='pixel'){ctx.fillStyle=c;ctx.fillRect(x-r,y-r,r*2,r*2)}else if(skin.type==='crystal'||skin.type==='hex'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);skinPoly(r,skin.type==='hex'?6:4,0,c,rgba(skin.ea,life*.28));ctx.restore()}else if(skin.type==='ghost'||skin.type==='ring'||skin.type==='target'){circle(x,y,r*1.25,null,c,1.3)}else if(skin.type==='star'){ctx.save();ctx.translate(x,y);skinStar(r*1.2,c,rgba(skin.ea,life*.25),0);ctx.restore()}else circle(x,y,r,c)}"""
          if old not in s: raise SystemExit('old skinOrb not found')
          s=s.replace(old,new,1)

          old_draw="""function drawWorld(){let t=THEMES[themeNow],skin=ORB_SKINS[skinIndex]||ORB_SKINS[0],a=anchor,b=ballPos();for(let h of history){let hl=h.life!=null?h.life:(h.l!=null?h.l:1);ctx.strokeStyle=rgba(t.c,.13*hl);ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(h.x1,h.y1);ctx.lineTo(h.x2,h.y2);ctx.stroke()}ctx.setLineDash([3,9]);circle(a.x,a.y,radius,null,rgba(t.c,.24),1.5);ctx.setLineDash([]);let tol=clamp(.30-hits*.004,.18,.30),zs=target.a-dir*tol,ze=target.a+dir*tol;arc(a.x,a.y,radius,dir>0?zs:ze,dir>0?ze:zs,rgba(t.a,.48),9);let beat=typeof rhythmPulse==='function'?rhythmPulse():0,hp=clamp(flash*2.5,0,1),p=3*Math.sin(now*.01)+beat*5+hp*7;circle(target.x,target.y,22+p,null,t.a,3.2);circle(target.x,target.y,34-p*.4,null,rgba(t.b,.42),2.2);circle(target.x,target.y,7,'#efffff');for(let q of trail)circle(q.x,q.y,5*q.life,rgba(skin.a,q.life*.58));let g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,rgba(skin.b,.92));g.addColorStop(1,rgba(skin.a,.92));ctx.strokeStyle=rgba(skin.a,.18);ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle=g;ctx.lineWidth=3.3;ctx.stroke();skinOrb(a.x,a.y,15,skin.b,skin.eb,skin.glow);skinOrb(b.x,b.y,15,skin.a,skin.ea,skin.glow);if(flash>.03){let r=18+(1-clamp(flash,0,1))*110;circle(a.x,a.y,r,null,rgba(skin.b,.27*flash),1.5+flash*3);circle(b.x,b.y,r*.72,null,rgba(skin.a,.23*flash),1+flash*2)}for(let q of sparks)circle(q.x,q.y,q.r,rgba(q.c,clamp(q.life*1.8,0,1)))}"""
          new_draw="""function drawWorld(){let t=THEMES[themeNow],skin=ORB_SKINS[skinIndex]||ORB_SKINS[0],a=anchor,b=ballPos();for(let h of history){let hl=h.life!=null?h.life:(h.l!=null?h.l:1);ctx.strokeStyle=rgba(skin.b,.12*hl);ctx.lineWidth=skin.type==='pixel'?5:7;ctx.setLineDash(skin.type==='pixel'?[8,6]:skin.type==='ghost'?[2,8]:[]);ctx.beginPath();ctx.moveTo(h.x1,h.y1);ctx.lineTo(h.x2,h.y2);ctx.stroke()}ctx.setLineDash([3,9]);circle(a.x,a.y,radius,null,rgba(skin.a,.22),1.5);ctx.setLineDash([]);let tol=clamp(.30-hits*.004,.18,.30),zs=target.a-dir*tol,ze=target.a+dir*tol;arc(a.x,a.y,radius,dir>0?zs:ze,dir>0?ze:zs,rgba(skin.a,.55),9);let beat=typeof rhythmPulse==='function'?rhythmPulse():0,hp=clamp(flash*2.5,0,1),p=3*Math.sin(now*.01)+beat*5+hp*7;circle(target.x,target.y,22+p,null,skin.a,3.2);circle(target.x,target.y,34-p*.4,null,rgba(skin.b,.46),2.2);circle(target.x,target.y,7,'#efffff');for(let q of trail)skinTrail(q.x,q.y,q.life,skin);let g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,rgba(skin.b,.94));g.addColorStop(1,rgba(skin.a,.94));ctx.strokeStyle=rgba(skin.a,.17);ctx.lineWidth=skin.type==='comet'?13:10;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle=g;ctx.lineWidth=skin.type==='pixel'?4.6:3.3;ctx.setLineDash(skin.type==='pixel'?[8,5]:skin.type==='ghost'?[2,6]:skin.type==='target'?[12,4]:[]);ctx.stroke();ctx.setLineDash([]);let ph=now*.001;skinOrb(a.x,a.y,15,skin.b,skin.eb,skin,ph);skinOrb(b.x,b.y,15,skin.a,skin.ea,skin,-ph+.8);if(flash>.03){let rr=18+(1-clamp(flash,0,1))*110;circle(a.x,a.y,rr,null,rgba(skin.b,.27*flash),1.5+flash*3);circle(b.x,b.y,rr*.72,null,rgba(skin.a,.23*flash),1+flash*2)}for(let q of sparks)circle(q.x,q.y,q.r,rgba(q.c,clamp(q.life*1.8,0,1)))}"""
          if old_draw not in s: raise SystemExit('drawWorld replace marker not found')
          s=s.replace(old_draw,new_draw,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')
          ui="""var ORBIT_SKINS_UI=[{name:'NEON PULSE',type:'classic',a:'#62f6ff',b:'#ff45cf',ea:'#e8ffff',eb:'#ffe1f6'},{name:'REACTOR CORE',type:'ring',a:'#49f3ff',b:'#9dff4a',ea:'#e6fdff',eb:'#efffd7'},{name:'PRISM SHARD',type:'crystal',a:'#9a7cff',b:'#49e7ff',ea:'#eee7ff',eb:'#dfffff'},{name:'PIXEL BYTE',type:'pixel',a:'#52ff9a',b:'#ffd84d',ea:'#e3ffee',eb:'#fff6c8'},{name:'VOID EYE',type:'eye',a:'#ff4ecb',b:'#7b68ff',ea:'#ffe3f8',eb:'#e8e3ff'},{name:'STAR FORGE',type:'star',a:'#ffd34e',b:'#ff5d4a',ea:'#fff6c8',eb:'#ffe3dd'},{name:'ECLIPSE',type:'eclipse',a:'#f4f7ff',b:'#83a4ff',ea:'#ffffff',eb:'#e7edff'},{name:'COMET DASH',type:'comet',a:'#42eaff',b:'#ff8a3d',ea:'#ddfbff',eb:'#ffe8d8'},{name:'HEX TECH',type:'hex',a:'#37ffc8',b:'#2e8cff',ea:'#dcfff5',eb:'#dceaff'},{name:'GHOST PHASE',type:'ghost',a:'#eefcff',b:'#bea8ff',ea:'#ffffff',eb:'#f0eaff'},{name:'DUALITY',type:'dual',a:'#ff5c9f',b:'#55e8ff',ea:'#ffe2ee',eb:'#e0fbff'},{name:'TARGET LOCK',type:'target',a:'#ff596e',b:'#ffffff',ea:'#ffe1e5',eb:'#ffffff'}];"""
          s,n=re.subn(r"var ORBIT_SKINS_UI=\[.*?\];",ui,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('UI skins array replace failed')

          render="""  function orbitRenderSkins(){var g=document.getElementById('orbitSkinsGrid');if(!g)return;var selected=orbitSkinSelected(),vi=orbitSettings.language==='vi',html='';for(var i=0;i<ORBIT_SKINS_UI.length;i++){var x=ORBIT_SKINS_UI[i];html+='<button class=\"orbit-skin-card skin-'+x.type+' '+(i===selected?'selected':'')+'\" data-skin=\"'+i+'\" style=\"--a:'+x.a+';--b:'+x.b+'\"><div class=\"orbit-skin-check\">✓</div><div class=\"orbit-skin-preview\"><span class=\"orbit-skin-ball first\" style=\"--c:'+x.b+';--e:'+x.eb+'\"></span><span class=\"orbit-skin-link\"></span><span class=\"orbit-skin-ball second\" style=\"--c:'+x.a+';--e:'+x.ea+'\"></span></div><div class=\"orbit-skin-name\">'+x.name+'</div><div class=\"orbit-skin-equipped\">'+(i===selected?(vi?'ĐANG DÙNG':'EQUIPPED'):'')+'</div></button>'}g.innerHTML=html}
  function orbitHideSkins()"""
          s,n=re.subn(r"  function orbitRenderSkins\(\)\{.*?\}\n  function orbitHideSkins\(\)",render,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('orbitRenderSkins replace failed')

          css="""/* DISTINCT ORB SKINS */.orbit-skin-ball{position:relative;overflow:visible}.skin-ring .orbit-skin-ball{background:transparent!important;border:3px solid var(--c);box-shadow:0 0 11px var(--c),inset 0 0 9px var(--c)}.skin-ring .orbit-skin-ball:after{content:\"\";position:absolute;inset:9px;border:2px solid var(--e);border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.skin-crystal .orbit-skin-ball{border-radius:5px;transform:rotate(45deg);background:linear-gradient(135deg,var(--e),var(--c) 45%,#15182f);box-shadow:0 0 16px var(--c)}.skin-pixel .orbit-skin-ball{border-radius:2px;box-shadow:0 0 0 4px rgba(255,255,255,.05),0 0 12px var(--c)}.skin-pixel .orbit-skin-link{height:5px;background:repeating-linear-gradient(90deg,var(--b) 0 7px,transparent 7px 11px,var(--a) 11px 18px)}.skin-eye .orbit-skin-ball{width:43px;height:29px;border-radius:70% 12%;transform:rotate(45deg);background:#050914;border:2px solid var(--c)}.skin-eye .orbit-skin-ball:after{content:\"\";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--e);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--c)}.skin-star .orbit-skin-ball{border:0;clip-path:polygon(50% 0,61% 34%,93% 25%,68% 49%,100% 61%,64% 65%,75% 100%,51% 73%,29% 100%,36% 64%,0 60%,32% 48%,7% 24%,39% 34%);background:linear-gradient(135deg,var(--e),var(--c));box-shadow:none;filter:drop-shadow(0 0 8px var(--c))}.skin-eclipse .orbit-skin-ball{background:var(--c);border:2px solid var(--e)}.skin-eclipse .orbit-skin-ball:after{content:\"\";position:absolute;width:31px;height:31px;border-radius:50%;background:#09101d;left:9px;top:-4px;box-shadow:-3px 2px 8px rgba(0,0,0,.45)}.skin-comet .orbit-skin-ball:before{content:\"\";position:absolute;right:29px;top:8px;width:35px;height:18px;clip-path:polygon(0 50%,100% 0,100% 100%);background:linear-gradient(90deg,transparent,var(--c));filter:drop-shadow(0 0 6px var(--c));z-index:-1}.skin-hex .orbit-skin-ball{border:0;border-radius:0;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);background:linear-gradient(135deg,var(--e),var(--c) 50%,#0b1730);box-shadow:none;filter:drop-shadow(0 0 8px var(--c))}.skin-ghost .orbit-skin-ball{background:rgba(255,255,255,.06);border:2px solid var(--c);opacity:.72;box-shadow:0 0 16px var(--c),inset 0 0 12px var(--c)}.skin-ghost .orbit-skin-ball:after{content:\"\";position:absolute;inset:7px;border:1px solid var(--e);border-radius:50%}.skin-dual .orbit-skin-ball{background:linear-gradient(90deg,var(--c) 0 50%,var(--e) 50% 100%);border:2px solid #fff}.skin-dual .orbit-skin-ball:after{content:\"\";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:50%;top:6px;transform:translateX(-50%);box-shadow:0 17px 0 #08111f}.skin-target .orbit-skin-ball{background:radial-gradient(circle,var(--c) 0 20%,transparent 22% 43%,var(--e) 45% 54%,transparent 56% 72%,var(--c) 74%);border:0;box-shadow:0 0 12px var(--c)}.skin-target .orbit-skin-ball:before,.skin-target .orbit-skin-ball:after{content:\"\";position:absolute;background:var(--e);opacity:.8}.skin-target .orbit-skin-ball:before{width:48px;height:1px;left:-6px;top:18px}.skin-target .orbit-skin-ball:after{width:1px;height:48px;left:18px;top:-6px}.skin-classic .orbit-skin-ball:after{content:\"\";position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.68);left:7px;top:6px}.skin-comet .orbit-skin-link{height:4px;box-shadow:0 0 14px var(--a)}"""
          if '/* DISTINCT ORB SKINS */' not in s:
              marker='@keyframes simpleTapPulse'
              if marker not in s: raise SystemExit('CSS insert marker missing')
              s=s.replace(marker,css+marker,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('game-base.html').read_text(encoding='utf-8')
          assert "type:'crystal'" in s and "type:'eye'" in s and 'function skinTrail' in s
          start=s.find('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/game.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/game.js
          cp index.html /tmp/skin-test.html
          python3 tools/fix_simple_ui.py /tmp/skin-test.html
          python3 tools/fix_rankings_position.py /tmp/skin-test.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/skin-test.html').read_text(encoding='utf-8')
          assert 'DISTINCT ORB SKINS' in s
          assert "skin-'+x.type" in s
          a=s.find('<script>')+len('<script>');b=s.rfind('</script>')
          Path('/tmp/wrapper.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/wrapper.js

      - name: Commit distinct skins
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html tools/fix_simple_ui.py
          git commit -m 'Redesign orb skins with unique shapes and effects'
          git push
