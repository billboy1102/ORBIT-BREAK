name: Temporary hide gameplay score on game over

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hide-play-score-on-over.yml'

permissions:
  contents: write

jobs:
  patch-gameover-score-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide live score during game over
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('game-base.html')
          s = p.read_text(encoding='utf-8')
          rule = 'body.menu-over .game-score{display:none!important}'
          if rule in s:
              print('rule already present')
          else:
              marker = '.game-score{position:fixed;left:50%;top:max(92px,15vh);transform:translateX(-50%);z-index:8;font-family:Arial,Helvetica,sans-serif;font-size:clamp(60px,16vw,96px);font-weight:300;line-height:1;letter-spacing:.02em;color:#fff;text-align:center;text-shadow:0 0 18px rgba(255,255,255,.12)}'
              if marker not in s:
                  raise SystemExit('game-score CSS marker not found')
              s = s.replace(marker, marker + rule, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- game-base.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html
          git commit -m 'Hide gameplay score on game over'
          git push
