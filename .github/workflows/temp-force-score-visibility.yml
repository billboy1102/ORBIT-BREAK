name: Temporary force score visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-force-score-visibility.yml'

permissions:
  contents: write

jobs:
  patch-score-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force gameplay score visibility by state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Base game: keep gameplay score hidden until play starts, show on reset, hide on game over.
          p = Path('game-base.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="game-score" id="score">0</div>', '<div class="game-score" id="score" style="display:none">0</div>', 1)
          old = "function reset(){score=0;combo=1;bestCombo=1;hits=0;speed=1.72;dir=1;progress=0;goal=2.65;anchor={x:0,y:0};camera={x:0,y:0};startAngle=-Math.PI/2;trail=[];sparks=[];history=[];shake=0;flash=0;message='';themeNow=themePrev=0;themeAt=now;buildTarget();state='play';el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();tone(260)}"
          new = "function reset(){score=0;combo=1;bestCombo=1;hits=0;speed=1.72;dir=1;progress=0;goal=2.65;anchor={x:0,y:0};camera={x:0,y:0};startAngle=-Math.PI/2;trail=[];sparks=[];history=[];shake=0;flash=0;message='';themeNow=themePrev=0;themeAt=now;buildTarget();state='play';el.score.style.display='block';el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();tone(260)}"
          if old in s:
              s = s.replace(old, new, 1)
          old = "function die(l){if(state!=='play')return;state='dying';message=l;shake=13;flash=1;tone(120,.17,.07);setTimeout(()=>{state='over';high=Math.max(high,score);localStorage.setItem('orbitBreakHigh',high);el.final.textContent=score;el.high.textContent=high;el.finalCombo.textContent='x'+bestCombo;el.over.classList.remove('hidden')},430)}"
          new = "function die(l){if(state!=='play')return;state='dying';message=l;shake=13;flash=1;el.score.style.display='none';tone(120,.17,.07);setTimeout(()=>{state='over';high=Math.max(high,score);localStorage.setItem('orbitBreakHigh',high);el.final.textContent=score;el.high.textContent=high;el.finalCombo.textContent='x'+bestCombo;el.over.classList.remove('hidden')},430)}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Wrapper/rhythm game: explicit inline visibility so menu classes/CSS order cannot break it.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "  document.body.classList.add('menu-start');\n}"
          repl = "  document.body.classList.add('menu-start');\n  if(el.score)el.score.style.display='none';\n}"
          if marker in s and repl not in s:
              s = s.replace(marker, repl, 1)

          old = "  rhythmStart();chooseGoal();buildTarget();state='play';document.body.classList.remove('menu-start','menu-over');el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();rhythmTone(330,.06,.045,'triangle');"
          new = "  rhythmStart();chooseGoal();buildTarget();state='play';document.body.classList.remove('menu-start','menu-over');if(el.score)el.score.style.display='block';el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();rhythmTone(330,.06,.045,'triangle');"
          if old in s:
              s = s.replace(old, new, 1)

          old = "  if(state!=='play')return;state='dying';message=label;shake=13;flash=1;rhythmFail();rhythmStop();if(navigator.vibrate)navigator.vibrate([25,35,55]);"
          new = "  if(state!=='play')return;state='dying';message=label;shake=13;flash=1;if(el.score)el.score.style.display='none';rhythmFail();rhythmStop();if(navigator.vibrate)navigator.vibrate([25,35,55]);"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit robust score visibility fix
        shell: bash
        run: |
          if git diff --quiet -- game-base.html index.html; then
            echo 'No score visibility changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html index.html
          git commit -m 'Force gameplay score hidden on menus and game over'
          git push
