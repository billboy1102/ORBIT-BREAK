name: Temporary distinct skins patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-run-distinct-skins.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply distinct skins
        run: python3 tools/patch_distinct_skins.py
      - name: Validate sources
        run: |
          python3 -m py_compile tools/fix_simple_ui.py tools/patch_distinct_skins.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('game-base.html').read_text()
          assert "type:'eye'" in s and 'function skinTrail' in s
          a=s.find('<script>')+len('<script>');b=s.rfind('</script>')
          Path('/tmp/game.js').write_text(s[a:b])
          PY
          node --check /tmp/game.js
          cp index.html /tmp/skin-test.html
          python3 tools/fix_simple_ui.py /tmp/skin-test.html
          python3 tools/fix_rankings_position.py /tmp/skin-test.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/skin-test.html').read_text()
          assert 'DISTINCT ORB SKINS' in s and "skin-'+x.type" in s
          a=s.find('<script>')+len('<script>');b=s.rfind('</script>')
          Path('/tmp/wrapper.js').write_text(s[a:b])
          PY
          node --check /tmp/wrapper.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html tools/fix_simple_ui.py
          git commit -m 'Redesign orb skins with unique shapes and effects'
          git push
