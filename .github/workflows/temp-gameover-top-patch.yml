name: Temporary game over top patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-gameover-top-patch.yml'

permissions:
  contents: write

jobs:
  patch-gameover-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move game over UI to top
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = "  document.head.appendChild(startTopStyle);\n"
          if marker not in text:
              raise SystemExit('Could not find startTopStyle insertion marker')
          insertion = '''  document.head.appendChild(startTopStyle);\n  const gameOverTopStyle=document.createElement('style');\n  gameOverTopStyle.textContent='#gameover{position:absolute;left:50%;top:max(108px,14vh);transform:translateX(-50%);width:min(92vw,560px);z-index:30;pointer-events:none}#gameover .over-backdrop{display:none!important}#gameover .over-panel{position:relative;padding:0!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;backdrop-filter:none!important}#gameover .over-panel:before,#gameover .over-emblem{display:none!important}#gameover .over-title{position:relative;margin:0;font-size:clamp(44px,12.5vw,72px);line-height:.94;font-weight:650;letter-spacing:-2px;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#fff!important;text-shadow:0 0 15px rgba(255,255,255,.26),0 0 30px rgba(89,234,255,.13);filter:none!important}#gameover .over-score{margin-top:18px;text-align:center}#gameover .over-score span{display:block;font-size:clamp(12px,3.2vw,17px);font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.55)}#gameover .over-score b{display:block;margin-top:4px;font-size:clamp(58px,17vw,92px);line-height:1;font-weight:300;color:#fff;letter-spacing:-2px}#gameover .over-meta{display:flex;align-items:center;justify-content:center;gap:13px;margin-top:12px;white-space:nowrap;color:rgba(255,255,255,.76);font-size:clamp(15px,4vw,23px);font-weight:450;letter-spacing:1px}#gameover .over-meta b{color:#fff;font-weight:550}#gameover .cta{display:block!important;width:auto!important;height:auto!important;margin:30px auto 0!important;padding:0!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;color:rgba(255,255,255,.62)!important;font-size:clamp(20px,5.3vw,32px)!important;font-weight:350!important;letter-spacing:1px!important}#gameover .cta:after,#gameover .retry-icon{display:none!important}@media(max-height:650px){#gameover{top:max(86px,12vh)}#gameover .over-title{font-size:clamp(38px,10.5vw,56px)}#gameover .over-score{margin-top:10px}#gameover .over-score b{font-size:52px}#gameover .over-meta{margin-top:7px;font-size:16px}#gameover .cta{margin-top:18px!important;font-size:18px!important}}';\n  document.head.appendChild(gameOverTopStyle);\n'''
          text = text.replace(marker, insertion, 1)
          pattern = r"    over\.innerHTML='[^\n]*';"
          replacement = "    over.innerHTML='<div class=\"over-panel\"><div class=\"over-title\">ORBIT LOST</div><div class=\"over-score\"><span>SCORE</span><b id=\"finalScore\">0</b></div><div class=\"over-meta\"><span>BEST <b id=\"highScore\">0</b></span><span>·</span><span>COMBO <b id=\"finalCombo\">x1</b></span></div><div class=\"cta\">TAP TO RETRY</div></div>';"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one gameover innerHTML line, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move game over title and stats to top'
          git push
