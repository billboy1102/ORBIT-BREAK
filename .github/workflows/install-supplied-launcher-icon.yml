name: Install supplied launcher icon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-launcher-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact supplied WebP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          target = '11127a52e2450ed09718472f562ca1febf0a1d1241ac065f61f96c2cec3740e6'
          out = Path('assets/orbit-break-icon.webp')
          if out.exists() and hashlib.sha256(out.read_bytes()).hexdigest() == target:
              print('Supplied launcher icon is already installed.')
              raise SystemExit(0)

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def fetch_blob(sha):
              url = f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'orbit-break-launcher-installer',
              })
              with urllib.request.urlopen(req) as r:
                  obj = json.load(r)
              return base64.b64decode(obj['content'])

          def as_b64_text(sha):
              raw = fetch_blob(sha)
              try:
                  return ''.join(raw.decode('ascii').split())
              except UnicodeDecodeError:
                  return None

          part0 = 'ea978ccd5395ce9bff5abf3c3a5e365c358e2ece'
          part1 = '0d136239ae89cdf229405902280e839d99d74d1d'
          candidates = [
              '9341cabc151852d767472641d49f698d8ab8c98b',
              '09cecfc2335d99dd5f7cc911fd1ec5a6417ebe94',
              'fb5bd34d194b1244ee5fd8d2d1c652b3cfade0f8',
              '846e9b41fc85ed0040857dbe4c971c294427d5b3',
              '8c6a063b35fe03a83689d5375a715d0c7bb5d0f7',
              'a71bc98ce757fb8b0f1ad6f2e854215513d9b3fa',
              '5d083b94eab65d3a481ebac32292331b4b536d47',
              '721ead2a92e7095882cbf782dcc60fab8d726dfd',
              'ccc0297441509b93055578aaaba8084834fcc9cb',
              '22640d30f64ce476e9728f5f293a937731fbbc41',
              '1ea012ba3275f63ba57420b40fc60bd439d5a1a8',
              '53b576e12f2bd94c425f4da712ef96578b74e351',
              '06e501f52b5920f6daea91bb7531c0f8cfec6b1c',
          ]

          s0 = as_b64_text(part0)
          s1 = as_b64_text(part1)
          if not s0 or not s1:
              raise SystemExit('Stored launcher prefix parts are unavailable.')
          prefix = s0 + s1

          p2s, p3s = [], []
          for sha in candidates:
              s = as_b64_text(sha)
              if not s:
                  continue
              if len(s) == 300000:
                  p2s.append((sha, s))
              elif len(s) == 29608:
                  p3s.append((sha, s))

          found = None
          for sha2, s2 in p2s:
              for sha3, s3 in p3s:
                  try:
                      data = base64.b64decode(prefix + s2 + s3, validate=True)
                  except Exception:
                      continue
                  if hashlib.sha256(data).hexdigest() == target:
                      found = (sha2, sha3, data)
                      break
              if found:
                  break

          if not found:
              raise SystemExit('Could not reconstruct the exact supplied launcher icon.')

          sha2, sha3, data = found
          out.write_bytes(data)
          print(f'Exact supplied icon reconstructed: {len(data)} bytes')
          print(f'parts: {part0}, {part1}, {sha2}, {sha3}')
          print('sha256=' + hashlib.sha256(data).hexdigest())
          PY

      - name: Commit exact launcher icon
        shell: bash
        run: |
          TARGET='11127a52e2450ed09718472f562ca1febf0a1d1241ac065f61f96c2cec3740e6'
          ACTUAL="$(sha256sum assets/orbit-break-icon.webp | awk '{print $1}')"
          test "$ACTUAL" = "$TARGET"
          if git diff --quiet -- assets/orbit-break-icon.webp; then
            echo 'Launcher icon already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/orbit-break-icon.webp
          git commit -m 'Replace launcher icon with supplied artwork'
          git push origin HEAD:main
