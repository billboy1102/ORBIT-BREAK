name: Temporary fix start prompt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-start-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix TAP TO START positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')
          marker='@keyframes simpleTapPulse{'
          css="body.menu-start #start{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important;transform:none!important;text-align:center!important;pointer-events:none!important}body.menu-start #start .simple-title{position:fixed!important;left:50%!important;top:17vh!important;transform:translateX(-50%)!important;z-index:121!important}body.menu-start #start .simple-tap{display:block!important;position:fixed!important;left:50%!important;top:auto!important;bottom:calc(84px + env(safe-area-inset-bottom) + 34px)!important;transform:translateX(-50%)!important;visibility:visible!important;z-index:221!important;text-shadow:0 0 14px rgba(255,255,255,.22)}@media(max-height:700px){body.menu-start #start .simple-tap{bottom:calc(72px + env(safe-area-inset-bottom) + 24px)!important}}"
          if css not in s:
              if marker not in s: raise SystemExit('keyframes marker not found')
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          grep -Fq 'body.menu-start #start .simple-tap{display:block!important' tools/fix_simple_ui.py
          grep -Fq 'bottom:calc(84px + env(safe-area-inset-bottom) + 34px)!important' tools/fix_simple_ui.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Restore TAP TO START on mobile menu'
          git push
