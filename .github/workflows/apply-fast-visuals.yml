name: Apply fast visuals patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fast-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply gameplay patch
        run: python3 scripts/apply_fast_visuals.py
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-fast-visuals.yml scripts/apply_fast_visuals.py
          git commit -m "Add more backgrounds and faster rhythm gameplay"
          git push
