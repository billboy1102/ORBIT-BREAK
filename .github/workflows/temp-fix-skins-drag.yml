name: Temporary robust skins drag fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-skins-drag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply robust skins scrolling fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')

          old="function orbitHideSkins(){var m=document.getElementById('orbitSkinsModal');if(m){m.classList.add('hidden');m.style.removeProperty('display');m.style.removeProperty('z-index')}var nav=document.getElementById('orbitBottomNav');if(nav)nav.style.removeProperty('z-index')}"
          new="function orbitHideSkins(){var m=document.getElementById('orbitSkinsModal');if(m){m.classList.add('hidden');m.style.removeProperty('display');m.style.removeProperty('z-index')}document.documentElement.classList.remove('orbit-skins-open');document.body.classList.remove('orbit-skins-open');document.documentElement.style.removeProperty('touch-action');document.body.style.removeProperty('touch-action');var nav=document.getElementById('orbitBottomNav');if(nav)nav.style.removeProperty('z-index')}"
          if old not in s and new not in s: raise SystemExit('orbitHideSkins marker not found')
          if old in s: s=s.replace(old,new,1)

          old="function orbitOpenSkins(e){if(e){e.preventDefault();e.stopPropagation()}var r=document.getElementById('orbitRankingsModal');if(r)r.classList.add('hidden');var m=document.getElementById('orbitSkinsModal');if(m){m.classList.remove('hidden');m.style.setProperty('display','flex','important');m.style.setProperty('z-index','510','important')}var nav=document.getElementById('orbitBottomNav');if(nav)nav.style.setProperty('z-index','600','important');orbitRenderSkins()}"
          new="function orbitOpenSkins(e){if(e){e.preventDefault();e.stopPropagation()}var r=document.getElementById('orbitRankingsModal');if(r)r.classList.add('hidden');document.documentElement.classList.add('orbit-skins-open');document.body.classList.add('orbit-skins-open');document.documentElement.style.setProperty('touch-action','pan-y','important');document.body.style.setProperty('touch-action','pan-y','important');var m=document.getElementById('orbitSkinsModal');if(m){m.classList.remove('hidden');m.style.setProperty('display','flex','important');m.style.setProperty('z-index','510','important')}var nav=document.getElementById('orbitBottomNav');if(nav)nav.style.setProperty('z-index','600','important');orbitRenderSkins()}"
          if old not in s and new not in s: raise SystemExit('orbitOpenSkins marker not found')
          if old in s: s=s.replace(old,new,1)

          old="var skinsGrid=document.getElementById('orbitSkinsGrid');if(skinsGrid)skinsGrid.addEventListener('click',function(e){var c=e.target.closest('.orbit-skin-card');if(c)orbitChooseSkin(Number(c.getAttribute('data-skin')),e)});"
          new="var skinsGrid=document.getElementById('orbitSkinsGrid');if(skinsGrid){var orbitSkinDragY=0,orbitSkinDragTop=0,orbitSkinDragged=false;skinsGrid.addEventListener('touchstart',function(e){if(!e.touches||e.touches.length!==1)return;orbitSkinDragY=e.touches[0].clientY;orbitSkinDragTop=skinsGrid.scrollTop;orbitSkinDragged=false},{passive:true});skinsGrid.addEventListener('touchmove',function(e){if(!e.touches||e.touches.length!==1)return;var dy=e.touches[0].clientY-orbitSkinDragY;if(Math.abs(dy)>3)orbitSkinDragged=true;skinsGrid.scrollTop=orbitSkinDragTop-dy;e.preventDefault();e.stopPropagation()},{passive:false});skinsGrid.addEventListener('touchend',function(e){e.stopPropagation()},{passive:true});skinsGrid.addEventListener('click',function(e){if(orbitSkinDragged){orbitSkinDragged=false;e.preventDefault();e.stopPropagation();return}var c=e.target.closest('.orbit-skin-card');if(c)orbitChooseSkin(Number(c.getAttribute('data-skin')),e)},true)};"
          if old not in s and new not in s: raise SystemExit('skinsGrid handler marker not found')
          if old in s: s=s.replace(old,new,1)

          css_old='.orbit-skins-panel,#orbitSkinsModal{touch-action:pan-y!important}.orbit-skin-card{touch-action:pan-y!important}'
          css_new='html.orbit-skins-open,body.orbit-skins-open{touch-action:pan-y!important}#orbitSkinsModal,.orbit-skins-panel,.orbit-skins-grid,.orbit-skin-card{touch-action:pan-y!important}.orbit-skin-card{touch-action:pan-y!important}'
          if css_old not in s and css_new not in s: raise SystemExit('skins touch css marker not found')
          if css_old in s: s=s.replace(css_old,css_new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          cp index.html /tmp/skins-scroll-test.html
          python3 tools/fix_simple_ui.py /tmp/skins-scroll-test.html
          python3 tools/fix_rankings_position.py /tmp/skins-scroll-test.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/fix_simple_ui.py').read_text(encoding='utf-8')
          assert "document.body.style.setProperty('touch-action','pan-y','important')" in s
          assert "skinsGrid.scrollTop=orbitSkinDragTop-dy" in s
          assert 'html.orbit-skins-open,body.orbit-skins-open{touch-action:pan-y!important}' in s
          h=Path('/tmp/skins-scroll-test.html').read_text(encoding='utf-8')
          a=h.find('<script>')+len('<script>');b=h.rfind('</script>')
          Path('/tmp/skins-scroll-test.js').write_text(h[a:b],encoding='utf-8')
          PY
          node --check /tmp/skins-scroll-test.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Fix Skins drag scrolling on mobile'
          git push
