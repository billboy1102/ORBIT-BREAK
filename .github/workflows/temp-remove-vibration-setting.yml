name: Temporary remove vibration setting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-remove-vibration-setting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove vibration setting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')

          label_markers=['id=\\"orbitVibrationLabel\\"','id="orbitVibrationLabel"']
          idx=next((s.find(x) for x in label_markers if s.find(x)>=0),-1)
          if idx<0:
              raise SystemExit('vibration label marker not found')
          starts=['<div class=\\"orbit-setting-row\\">','<div class="orbit-setting-row">']
          start=max(s.rfind(x,0,idx) for x in starts)
          if start<0:
              raise SystemExit('vibration row start not found')
          end=s.find('</button></div>',idx)
          if end<0:
              raise SystemExit('vibration row end not found')
          end+=len('</button></div>')
          s=s[:start]+s[end:]

          old="settings:vi?'CÀI ĐẶT':'SETTINGS',vibration:vi?'Rung':'Vibration',language:"
          new="settings:vi?'CÀI ĐẶT':'SETTINGS',language:"
          if old not in s:
              raise SystemExit('vibration language key not found')
          s=s.replace(old,new,1)

          old="set('orbitSettingsTitle',tx.settings);set('orbitVibrationLabel',tx.vibration);set('orbitLanguageLabel',tx.language);"
          new="set('orbitSettingsTitle',tx.settings);set('orbitLanguageLabel',tx.language);"
          if old not in s:
              raise SystemExit('vibration language setter not found')
          s=s.replace(old,new,1)

          old="    var vib=document.getElementById('orbitVibrationToggle');if(vib)vib.classList.toggle('on',!!orbitSettings.vibration);\n"
          if old not in s:
              raise SystemExit('vibration sync line not found')
          s=s.replace(old,'',1)

          old="  document.getElementById('orbitVibrationToggle').addEventListener('click',function(e){stop(e);orbitSettings.vibration=!orbitSettings.vibration;saveSettings();syncSettingsUi();if(orbitSettings.vibration&&navigator.vibrate)navigator.vibrate(18)});\n"
          if old not in s:
              raise SystemExit('vibration click handler not found')
          s=s.replace(old,'',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          ! grep -Fq 'orbitVibrationToggle' tools/fix_simple_ui.py
          ! grep -Fq 'orbitVibrationLabel' tools/fix_simple_ui.py
          ! grep -Fq "vibration:vi?'Rung':'Vibration'" tools/fix_simple_ui.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fix_simple_ui.py
          git commit -m 'Remove vibration option from Settings'
          git push
