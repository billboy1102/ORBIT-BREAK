name: Temporary fix skins scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-skins-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix touch scrolling in skins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The game globally cancels touchmove to prevent page gestures while playing.
          # Allow touchmove inside menu overlays so their scroll containers can pan vertically.
          p=Path('game-base.html')
          s=p.read_text(encoding='utf-8')
          old="document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});"
          new="document.addEventListener('touchmove',e=>{if(e.target&&e.target.closest&&e.target.closest('#orbitSkinsModal,#orbitRankingsModal,.orbit-modal,.orbit-guide,.orbit-name-modal'))return;e.preventDefault()},{passive:false});"
          if old not in s and new not in s:
              raise SystemExit('game-base touchmove marker not found')
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Explicitly opt the Skins overlay/list back into native vertical panning on iOS/Android.
          p=Path('tools/fix_simple_ui.py')
          s=p.read_text(encoding='utf-8')
          old_css='.orbit-skins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:min(62vh,600px);overflow:auto;padding:3px}'
          new_css='.orbit-skins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:min(62vh,600px);overflow-y:auto;overflow-x:hidden;padding:3px;touch-action:pan-y!important;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}.orbit-skins-panel,#orbitSkinsModal{touch-action:pan-y!important}.orbit-skin-card{touch-action:pan-y!important}'
          if old_css not in s and new_css not in s:
              raise SystemExit('skins grid CSS marker not found')
          if old_css in s:
              s=s.replace(old_css,new_css,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate fix
        run: |
          python3 -m py_compile tools/fix_simple_ui.py
          python3 - <<'PY'
          from pathlib import Path
          g=Path('game-base.html').read_text(encoding='utf-8')
          u=Path('tools/fix_simple_ui.py').read_text(encoding='utf-8')
          assert "closest('#orbitSkinsModal,#orbitRankingsModal,.orbit-modal,.orbit-guide,.orbit-name-modal')" in g
          assert 'touch-action:pan-y!important' in u
          assert '-webkit-overflow-scrolling:touch' in u
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-base.html tools/fix_simple_ui.py
          git commit -m 'Fix vertical scrolling in Skins menu'
          git push
