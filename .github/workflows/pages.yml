name: Deploy ORBIT BREAK to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply current game UI and branding
        run: |
          python3 tools/apply_native_music_pack.py --ui-only index.html
          python3 tools/fix_simple_ui.py index.html
          python3 tools/fix_rankings_position.py index.html
          python3 tools/fix_branding.py index.html

      - name: Validate Bobbey splash and web wrapper
        run: |
          test -s assets/bobbey-game-studio-splash.webp
          test -s assets/orbit-break-icon.webp
          grep -Fq 'assets/bobbey-game-studio-splash.webp' index.html
          ! grep -Fq 'assets/bobbey-game-studio-splash.jpg' index.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert '#orbitRankingsModal{inset:0 0 calc(84px + env(safe-area-inset-bottom)) 0!important;' in html
          assert 'bottom:calc(84px + env(safe-area-inset-bottom))!important;inset:auto!important;' not in html
          start=html.find('<script>')+len('<script>')
          end=html.rfind('</script>')
          Path('/tmp/orbit-wrapper.js').write_text(html[start:end])
          PY
          node --check /tmp/orbit-wrapper.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
