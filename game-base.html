function bossFx(t){let b=clamp((combo-5)/9,0,1);if(!b)return;let beat=typeof rhythmPulse==='function'?rhythmPulse():0,cx=W*.5-camera.x*.02,cy=H*.42-camera.y*.02,p=b*(.75+.25*Math.sin(now*.008)+beat*.35);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){let r=42+i*30+p*18;ctx.strokeStyle=rgba(i%2?t.b:t.a,.07+p*.13);ctx.lineWidth=1.2+i*.3;ctx.beginPath();ctx.arc(cx,cy,r,now*.0006*(i%2?1:-1),now*.0006*(i%2?1:-1)+Math.PI*1.45);ctx.stroke()}for(let i=0;i<10;i++){let a=now*.0009+i*TAU/10,r=50+p*24;ctx.strokeStyle=rgba(i%2?t.a:t.b,.05+p*.1);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.55);ctx.lineTo(cx+Math.cos(a)*(r+60),cy+Math.sin(a)*(r+60)*.55);ctx.stroke()}let g=ctx.createRadialGradient(cx,cy,0,cx,cy,85);g.addColorStop(0,rgba('#ffffff',.14*p));g.addColorStop(.2,rgba(t.b,.2*p));g.addColorStop(1,rgba(t.a,0));ctx.fillStyle=g;circle(cx,cy,90,g);ctx.globalCompositeOperation='source-over';ctx.fillStyle=rgba(t.b,.6*b);ctx.font='1000 10px system-ui';ctx.textAlign='center';ctx.shadowColor=t.b;ctx.shadowBlur=12;ctx.fillText('BOSS LINK // COMBO '+combo,cx,cy+104);ctx.restore()}
function drawBackground(){let n=Math.floor(hits/5)%THEMES.length;if(n!==themeNow){themePrev=themeNow;themeNow=n;themeAt=now;updateHUD()}let m=clamp((now-themeAt)/1000,0,1),e=m*m*(3-2*m);ctx.fillStyle='#010308';ctx.fillRect(0,0,W,H);ctx.save();themeDraw(themePrev,THEMES[themePrev]);ctx.restore();if(themeNow!==themePrev){ctx.save();ctx.globalAlpha=e;themeDraw(themeNow,THEMES[themeNow]);ctx.restore()}deepTunnel(THEMES[themeNow]);bossFx(THEMES[themeNow]);let flow=clamp((speed-1.5)/2.8,0,1);for(let d of dust){let sh=now*.018*d.s*(.6+flow),x=((d.x-camera.x*.42-sh*Math.cos(d.a))%(W+180)+(W+180))%(W+180)-90,y=((d.y-camera.y*.42-sh*Math.sin(d.a))%(H+180)+(H+180))%(H+180)-90;ctx.strokeStyle=rgba(THEMES[themeNow].a,.04+flow*.14);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d.l*Math.cos(d.a),y+d.l*Math.sin(d.a));ctx.stroke()}}
function drawWorld(){let t=THEMES[themeNow],skin=ORB_SKINS[skinIndex]||ORB_SKINS[0],a=anchor,b=ballPos();for(let h of history){let hl=h.life!=null?h.life:(h.l!=null?h.l:1);ctx.strokeStyle=rgba(skin.b,.12*hl);ctx.lineWidth=skin.type==='pixel'?5:7;ctx.setLineDash(skin.type==='pixel'?[8,6]:skin.type==='ghost'?[2,8]:[]);ctx.beginPath();ctx.moveTo(h.x1,h.y1);ctx.lineTo(h.x2,h.y2);ctx.stroke()}ctx.setLineDash([3,9]);circle(a.x,a.y,radius,null,rgba(skin.a,.22),1.5);ctx.setLineDash([]);let tol=clamp(.30-hits*.004,.18,.30),zs=target.a-dir*tol,ze=target.a+dir*tol;arc(a.x,a.y,radius,dir>0?zs:ze,dir>0?ze:zs,rgba(skin.a,.55),9);let beat=typeof rhythmPulse==='function'?rhythmPulse():0,hp=clamp(flash*2.5,0,1),p=3*Math.sin(now*.01)+beat*5+hp*7;circle(target.x,target.y,22+p,null,skin.a,3.2);circle(target.x,target.y,34-p*.4,null,rgba(skin.b,.46),2.2);circle(target.x,target.y,7,'#efffff');for(let q of trail)skinTrail(q.x,q.y,q.life,skin);let g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,rgba(skin.b,.94));g.addColorStop(1,rgba(skin.a,.94));ctx.strokeStyle=rgba(skin.a,.17);ctx.lineWidth=skin.type==='comet'?13:10;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle=g;ctx.lineWidth=skin.type==='pixel'?4.6:3.3;ctx.setLineDash(skin.type==='pixel'?[8,5]:skin.type==='ghost'?[2,6]:skin.type==='target'?[12,4]:[]);ctx.stroke();ctx.setLineDash([]);let ph=now*.001;skinOrb(a.x,a.y,15,skin.b,skin.eb,skin,ph);skinOrb(b.x,b.y,15,skin.a,skin.ea,skin,-ph+.8);if(flash>.03){let rr=18+(1-clamp(flash,0,1))*110;circle(a.x,a.y,rr,null,rgba(skin.b,.27*flash),1.5+flash*3);circle(b.x,b.y,rr*.72,null,rgba(skin.a,.23*flash),1+flash*2)}for(let q of sparks)circle(q.x,q.y,q.r,rgba(q.c,clamp(q.life*1.8,0,1)))}
function overlay(){let t=THEMES[themeNow],beat=typeof rhythmPulse==='function'?rhythmPulse():0,v=clamp(flash*2.2+beat*.35,0,1);if(v){let g=ctx.createRadialGradient(W*.5,H*.57,10,W*.5,H*.57,Math.max(W,H)*.48);g.addColorStop(0,rgba(t.a,.07*v));g.addColorStop(.6,rgba(t.b,.035*v));g.addColorStop(1,rgba(t.a,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}let boss=clamp((combo-5)/9,0,1),c=Math.max(flash*.45,boss*.34);if(c){ctx.globalCompositeOperation='screen';ctx.fillStyle=`rgba(255,0,90,${c*.026})`;ctx.fillRect(2+boss*2,0,W,H);ctx.fillStyle=`rgba(0,220,255,${c*.026})`;ctx.fillRect(-2-boss*2,0,W,H);ctx.globalCompositeOperation='source-over'}let vg=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.16,W*.5,H*.5,Math.max(W,H)*.76);vg.addColorStop(0,'#00000000');vg.addColorStop(1,'#00000055');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff07';for(let y=0;y<H;y+=4){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}if(flash){ctx.fillStyle=`rgba(255,255,255,${flash*.105})`;ctx.fillRect(0,0,W,H)}}
