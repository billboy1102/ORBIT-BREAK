let W=0,H=0,DPR=1,now=0,last=performance.now(),state='menu',score=0,combo=1,bestCombo=1,hits=0,high=+localStorage.getItem('orbitBreakHigh')||0,radius=100,anchor={x:0,y:0},startAngle=-Math.PI/2,dir=1,progress=0,goal=2.65,speed=1.72,target={x:0,y:0,a:0},camera={x:0,y:0},shake=0,flash=0,message='',trail=[],sparks=[],history=[],audioCtx=null,stars=[],dust=[],buildings=[],boards=[],bands=[],cols=[],themeNow=0,themePrev=0,themeAt=0;

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);radius=clamp(Math.min(W,H)*.27,76,128);seedBackground();if(state!=='play'){anchor={x:0,y:0};camera={x:0,y:0};buildTarget()}}
function ballPos(){return{x:anchor.x+Math.cos(startAngle+dir*progress)*radius,y:anchor.y+Math.sin(startAngle+dir*progress)*radius}}function buildTarget(){const a=startAngle+dir*goal;target={x:anchor.x+Math.cos(a)*radius,y:anchor.y+Math.sin(a)*radius,a}}function chooseGoal(){goal=rand(hits<4?2:1,hits<4?3.8:5);if(hits>7&&Math.random()<Math.min(.12+(hits-7)*.008,.28))dir*=-1}
function updateHUD(){el.score.textContent=score;el.combo.textContent='x'+combo;el.themeBadge.textContent=THEMES[themeNow].name}function toast(t,c='#8bffd5'){el.toast.textContent=t;el.toast.style.color=c;el.toast.classList.remove('show');void el.toast.offsetWidth;el.toast.classList.add('show')}

function reset(){score=0;combo=1;bestCombo=1;hits=0;speed=1.72;dir=1;progress=0;goal=2.65;anchor={x:0,y:0};camera={x:0,y:0};startAngle=-Math.PI/2;trail=[];sparks=[];history=[];shake=0;flash=0;message='';themeNow=themePrev=0;themeAt=now;buildTarget();state='play';el.score.style.display='block';el.start.classList.add('hidden');el.over.classList.add('hidden');updateHUD();tone(260)}
function success(d){const old={...anchor};history.push({x1:old.x,y1:old.y,x2:target.x,y2:target.y,l:1});if(history.length>90)history.shift();anchor={x:target.x,y:target.y};startAngle=Math.atan2(old.y-anchor.y,old.x-anchor.x);progress=0;hits++;let perfect=d<Math.max(.075,.13-hits*.0015);score+=1;combo=1;if(perfect){toast('PERFECT',THEMES[themeNow].a)}else{toast('GOOD',THEMES[themeNow].b)}bestCombo=1;speed=Math.min(4.15,1.72+hits*.055);flash=perfect?.52:.32;shake=perfect?9:5;burst(anchor.x,anchor.y,perfect?28:16);chooseGoal();buildTarget();updateHUD()}

function update(dt){if(state==='play'){progress+=speed*dt;let tol=clamp(.30-hits*.004,.18,.30);if(progress>goal+tol)die('TOO LATE');let b=ballPos();trail.push({x:b.x,y:b.y,life:1});if(trail.length>40)trail.shift();let look=.3,dx=anchor.x+(target.x-anchor.x)*look,dy=anchor.y+(target.y-anchor.y)*look,k=1-Math.exp(-dt*10);camera.x+=(dx-camera.x)*k;camera.y+=(dy-camera.y)*k}for(let p of trail)p.life-=dt*2.15;trail=trail.filter(p=>p.life>0);for(let h of history){if(h.life!=null)h.life=Math.max(.14,h.life-dt*.05);else h.l=Math.max(.14,h.l-dt*.05);}for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}sparks=sparks.filter(p=>p.life>0);shake=Math.max(0,shake-dt*36);flash=Math.max(0,flash-dt*2.8)}
function sky(t){let g=ctx.createRadialGradient(W*.5,H*.45,10,W*.5,H*.5,Math.max(W,H)*.9);g.addColorStop(0,t.bg);g.addColorStop(.6,t.bg2);g.addColorStop(1,'#010308');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let s of stars){let x=((s.x-camera.x*s.d)%(W+80)+(W+80))%(W+80)-40,y=((s.y-camera.y*s.d)%(H+80)+(H+80))%(H+80)-40,a=.18+.18*Math.sin(now*.001+s.p);circle(x,y,s.r,`rgba(210,230,255,${a})`)}}
function deepTunnel(t){let vX=W*.5-camera.x*.045,vY=H*.42-camera.y*.035,flow=clamp((speed-1.5)/2.7,0,1);for(let i=38;i>=0;i--){let d=((i+now*.003*(1.2+flow*2.5))%39)/39,e=d*d;ctx.strokeStyle=rgba(i%3?t.a:t.b,(1-d)*(.025+flow*.09));ctx.lineWidth=.8+d*3.3;ctx.beginPath();ctx.ellipse(vX,vY+e*H*.5,W*(.025+d*.86),H*(.012+d*.66),0,Math.PI*.07,Math.PI*.93);ctx.stroke()}for(let i=-8;i<=8;i++){ctx.strokeStyle=rgba(i%2?t.a:t.b,.035+flow*.07);ctx.beginPath();ctx.moveTo(vX+i*8,vY);ctx.lineTo(W*.5+i*W*.15-camera.x*.08,H+30);ctx.stroke()}let g=ctx.createRadialGradient(vX,vY,0,vX,vY,Math.min(W,H)*.2);g.addColorStop(0,rgba(t.a,.18));g.addColorStop(1,rgba(t.a,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function billboards(t){for(let b of boards){let x=((b.x-camera.x*.12+Math.sin(now*.001+b.p)*13)%(W+220)+(W+220))%(W+220)-110,y=b.y-camera.y*.06+Math.sin(now*.0014+b.p)*5,c=b.q?t.a:t.b,fl=.58+.35*Math.sin(now*.006+b.p);ctx.shadowColor=c;ctx.shadowBlur=18;ctx.fillStyle='#040916bb';ctx.strokeStyle=rgba(c,.7);ctx.lineWidth=1.6;ctx.fillRect(x-b.w/2,y-b.h/2,b.w,b.h);ctx.strokeRect(x-b.w/2,y-b.h/2,b.w,b.h);ctx.fillStyle=rgba(c,clamp(fl,.2,1));ctx.font=`900 ${Math.max(10,b.h*.32)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.t,x,y);ctx.shadowBlur=0}}
function neonCity(t){sky(t);let hor=H*.91-camera.y*.02,ox=-((camera.x*.23)%(W+120));for(let b of buildings){for(let x of[b.x+ox-(W+120),b.x+ox,b.x+ox+(W+120)]){if(x>W+70||x<-70-b.w)continue;ctx.fillStyle='#07101e';ctx.fillRect(x,hor-b.h,b.w,b.h);if(b.n){ctx.strokeStyle=rgba(t.b,.55);ctx.strokeRect(x+1,hor-b.h+1,b.w-2,b.h-2)}for(let r=1;r<Math.floor(b.h/17);r++)for(let c=1;c<Math.floor(b.w/10);c++)if((r+c+Math.floor(b.z*9))%3){ctx.fillStyle=rgba(t.a,.25+.15*Math.sin(now*.002+r+c));ctx.fillRect(x+c*9,hor-b.h+r*15,2,4)}}}billboards(t)}
function cosmic(t){sky(t);let top=H*.68;ctx.strokeStyle=rgba(t.b,.13);for(let i=0;i<12;i++){let d=i/11,y=top+d*d*(H-top+30);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W*.5+i*10,H*.42);ctx.lineTo(W*.5+i*W*.15,H+20);ctx.stroke()}for(let i=0;i<8;i++){let x=((i*137-camera.x*.08)%(W+100)+(W+100))%(W+100)-50,y=((i*83-camera.y*.06)%(H+100)+(H+100))%(H+100)-50;circle(x,y,28+i*6,null,rgba(i%2?t.a:t.c,.08),1.5)}}

function bossFx(t){let b=clamp((combo-5)/9,0,1);if(!b)return;let beat=typeof rhythmPulse==='function'?rhythmPulse():0,cx=W*.5-camera.x*.02,cy=H*.42-camera.y*.02,p=b*(.75+.25*Math.sin(now*.008)+beat*.35);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){let r=42+i*30+p*18;ctx.strokeStyle=rgba(i%2?t.b:t.a,.07+p*.13);ctx.lineWidth=1.2+i*.3;ctx.beginPath();ctx.arc(cx,cy,r,now*.0006*(i%2?1:-1),now*.0006*(i%2?1:-1)+Math.PI*1.45);ctx.stroke()}for(let i=0;i<10;i++){let a=now*.0009+i*TAU/10,r=50+p*24;ctx.strokeStyle=rgba(i%2?t.a:t.b,.05+p*.1);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.55);ctx.lineTo(cx+Math.cos(a)*(r+60),cy+Math.sin(a)*(r+60)*.55);ctx.stroke()}let g=ctx.createRadialGradient(cx,cy,0,cx,cy,85);g.addColorStop(0,rgba('#ffffff',.14*p));g.addColorStop(.2,rgba(t.b,.2*p));g.addColorStop(1,rgba(t.a,0));ctx.fillStyle=g;circle(cx,cy,90,g);ctx.globalCompositeOperation='source-over';ctx.fillStyle=rgba(t.b,.6*b);ctx.font='1000 10px system-ui';ctx.textAlign='center';ctx.shadowColor=t.b;ctx.shadowBlur=12;ctx.fillText('BOSS LINK // COMBO '+combo,cx,cy+104);ctx.restore()}
